              private func collectReference(_ parts: [SubtitlePart]) {
                  // only timings of the embedded (container) track are a valid reference
                  guard coordinator.subtitleModel.selectedSubtitleInfo is FFmpegAssetTrack else { return }
                  for part in parts {
                      let key = Int((part.start * 100).rounded())
                      if refKeys.insert(key).inserted, refStarts.count < 5000 {
                          refStarts.append(part.start)
                      }
                  }
              }

              private func shiftDelay(_ by: Double) {
                  subDelay = ((subDelay + by) * 100).rounded() / 100
                  applyDelay()
              }

              private func applyDelay() {
                  coordinator.subtitleModel.subtitleDelay = subDelay
                  UserDefaults.standard.set(subDelay, forKey: delayKey)
              }

              private func autoSync() {
                  guard let info = coordinator.subtitleModel.selectedSubtitleInfo as? URLSubtitleInfo else {
                      syncMessage = "Сначала добавьте или выберите свои субтитры"
                      return
                  }
                  guard refStarts.count >= 8 else {
                      syncMessage = "Посмотрите немного встроенных субтитров (нужно около 8 реплик) и нажмите снова"
                      return
                  }
                  guard let text = SubtitleSync.readText(info.downloadURL) else {
                      syncMessage = "Не удалось прочитать файл субтитров"
                      return
                  }
                  let external = SubtitleSync.cueStarts(text)
                  guard let result = SubtitleSync.bestOffset(reference: refStarts, external: external),
                        result.matches >= max(8, result.total / 2) else {
                      syncMessage = "Совпадений мало: похоже, файл от другой раздачи"
                      return
                  }
                  subDelay = result.delay
                  applyDelay()
                  syncMessage = String(format: "Подобрано: %+.2f с (совпало %d из %d)",
                                       result.delay, result.matches, result.total)
              }

              private func addExternalSubtitle(_ src: URL) {
                  let access = src.startAccessingSecurityScopedResource()
                  defer { if access { src.stopAccessingSecurityScopedResource() } }
                  let ext = src.pathExtension.lowercased()
                  guard ["srt", "ass", "ssa", "vtt"].contains(ext) else {
                      syncMessage = "Поддерживаются .srt, .ass, .ssa и .vtt"
                      return
                  }
                  // saved next to the video under the video's name: it is picked up automatically next time
                  let dest = url.deletingPathExtension().appendingPathExtension(ext)
                  do {
                      if FileManager.default.fileExists(atPath: dest.path) {
                          try FileManager.default.removeItem(at: dest)
                      }
                      try FileManager.default.copyItem(at: src, to: dest)
                  } catch {
