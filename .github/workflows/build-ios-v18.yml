          function locate(
            parts: TextPart[],
            pos: number,
            forEnd: boolean,
          ): { node: Text; offset: number } | null {
            let lo = 0;
            let hi = parts.length - 1;
            let found = -1;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              const ok = forEnd ? parts[mid].start < pos : parts[mid].start <= pos;
              if (ok) {
                found = mid;
                lo = mid + 1;
              } else {
