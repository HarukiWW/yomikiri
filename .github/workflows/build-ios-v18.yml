            const rejected = new WeakSet<Element>();
            const io = new IntersectionObserver(
              (entries) => {
                for (const e of entries) {
                  const block = blocks.get(e.target);
                  if (block === undefined || !e.isIntersecting || block.state !== "new") continue;
                  block.state = "queued";
