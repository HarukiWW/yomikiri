          UTILS_ADD = r'''
          // MARK: - Dictionary language

          /// The app saves its settings as JSON. The dictionary language is copied to a small separate value,
          /// because the Safari extension asks for it often.
          public func syncDictionaryLanguage(fromConfig json: String) {
              guard let data = json.data(using: .utf8),
                    let object = (try? JSONSerialization.jsonObject(with: data)) as? [String: Any]
              else {
                  return
              }
              let language = (object["dictionary.language"] as? String) == "en" ? "en" : "ru"
              let current = (try? Storage.dictLang.get()) ?? ""
              if current != language {
                  _ = try? Storage.dictLang.set(language)
              }
          }

          // MARK: - Frequency dictionaries imported in the app

          public struct FreqIndexEntry: Codable {
              public var id: String
              public var name: String
              public var size: Int
          }

          public struct FreqSaveRequest: Codable {
              public var id: String
              public var name: String
              public var seq: Int
              public var total: Int
              public var data: String
          }

          public struct FreqReadRequest: Codable {
              public var id: String
              public var offset: Int
              public var length: Int
          }

          private func freqDirectory() throws -> URL {
              let dir = try getSharedDirectory().appendingPathComponent("freq")
              if !FileManager.default.fileExists(atPath: dir.path) {
                  try FileManager.default.createDirectory(at: dir, withIntermediateDirectories: true)
              }
              return dir
          }

          private func safeFreqId(_ id: String) -> String {
              let allowed = CharacterSet.alphanumerics.union(CharacterSet(charactersIn: "_-"))
              var result = ""
              for scalar in id.unicodeScalars where scalar.isASCII && allowed.contains(scalar) {
                  result.unicodeScalars.append(scalar)
              }
              return result
          }

          private func readFreqIndex() -> [FreqIndexEntry] {
              guard let dir = try? freqDirectory(),
                    let data = try? Data(contentsOf: dir.appendingPathComponent("index.json")),
                    let list = try? JSONDecoder().decode([FreqIndexEntry].self, from: data)
              else {
                  return []
              }
              return list.filter {
                  FileManager.default.fileExists(atPath: dir.appendingPathComponent(safeFreqId($0.id) + ".bin").path)
              }
          }

          private func writeFreqIndex(_ list: [FreqIndexEntry]) throws {
              let dir = try freqDirectory()
              let data = try JSONEncoder().encode(list)
              try data.write(to: dir.appendingPathComponent("index.json"), options: .atomic)
          }

          /// JSON array of the imported dictionaries.
          public func freqIndexJson() -> String {
              guard let data = try? JSONEncoder().encode(readFreqIndex()),
                    let text = String(data: data, encoding: .utf8)
              else {
                  return "[]"
              }
              return text
          }

          /// The app sends a dictionary in several parts. The last part finishes the file.
          public func freqSaveChunk(id rawId: String, name: String, seq: Int, total: Int, base64: String) throws {
              let id = safeFreqId(rawId)
              guard !id.isEmpty, let chunk = Data(base64Encoded: base64) else {
                  throw YomikiriTokenizerError.CouldNotAccessDirectory
              }
              let fm = FileManager.default
              let dir = try freqDirectory()
              let part = dir.appendingPathComponent(id + ".bin.part")
              if seq == 0 {
                  try? fm.removeItem(at: part)
                  fm.createFile(atPath: part.path, contents: nil)
              }
              let handle = try FileHandle(forWritingTo: part)
              defer { try? handle.close() }
              try handle.seekToEnd()
              try handle.write(contentsOf: chunk)
              if seq == total - 1 {
                  let final = dir.appendingPathComponent(id + ".bin")
                  try? fm.removeItem(at: final)
                  try fm.moveItem(at: part, to: final)
                  let attributes = try fm.attributesOfItem(atPath: final.path)
                  let size = (attributes[.size] as? NSNumber)?.intValue ?? 0
                  var list = readFreqIndex().filter { $0.id != id }
                  list.append(FreqIndexEntry(id: id, name: name, size: size))
                  try writeFreqIndex(list)
              }
          }

          public func freqDelete(id rawId: String) {
              let id = safeFreqId(rawId)
              guard let dir = try? freqDirectory() else {
                  return
              }
              try? FileManager.default.removeItem(at: dir.appendingPathComponent(id + ".bin"))
              try? FileManager.default.removeItem(at: dir.appendingPathComponent(id + ".bin.part"))
              _ = try? writeFreqIndex(readFreqIndex().filter { $0.id != id })
          }

          /// base64 of `length` bytes of the dictionary starting at `offset`
          public func freqReadChunk(id rawId: String, offset: Int, length: Int) -> String {
              let id = safeFreqId(rawId)
              guard let dir = try? freqDirectory(),
                    let handle = try? FileHandle(forReadingFrom: dir.appendingPathComponent(id + ".bin"))
              else {
                  return ""
              }
              defer { try? handle.close() }
              do {
                  try handle.seek(toOffset: UInt64(max(0, offset)))
                  let data = try handle.read(upToCount: max(0, length)) ?? Data()
                  return data.base64EncodedString()
              } catch {
                  return ""
              }
          }
          '''

