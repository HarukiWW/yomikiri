              const idx = m.index ?? 0;
              if (begin >= 0 && idx + m[0].length - begin > CHUNK_MAX) {
                chunks.push({ text: text.slice(begin, end), start: begin });
                begin = -1;
              }
              if (begin < 0) begin = idx;
              end = idx + m[0].length;
            }
            if (begin >= 0) chunks.push({ text: text.slice(begin, end), start: begin });
