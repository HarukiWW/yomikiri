          CUSTOM_FREQ_TS = r'''/**
           * Frequency dictionaries imported by the user in the app (settings page).
           * The Yomitan zip is converted here into the same binary table as the built-in dictionaries,
           * and the app stores it in the shared folder, so the Safari extension can read it too.
           */
          import { writable } from "svelte/store";
          import { Platform } from "@platform";

          export interface CustomFreqEntry {
            id: string;
            name: string;
            size: number;
          }

          export const customFreq = writable<CustomFreqEntry[]>([]);
          export const customFreqLoaded = writable(false);

          // eslint-disable-next-line
          const app = Platform as any;
          const SAVE_CHUNK = 393216;

          export function parseLabels(raw: unknown): Record<string, string> {
            try {
              const parsed: unknown = JSON.parse(typeof raw === "string" && raw !== "" ? raw : "{}");
              return typeof parsed === "object" && parsed !== null
                ? (parsed as Record<string, string>)
                : {};
            } catch (_e) {
              return {};
            }
          }

          export async function refreshCustomFreq(): Promise<void> {
            try {
              const list = (await app.messageWebview("freqIndex", null)) as CustomFreqEntry[];
              customFreq.set(Array.isArray(list) ? list : []);
            } catch (e) {
              console.error(e);
              customFreq.set([]);
            } finally {
              customFreqLoaded.set(true);
            }
          }

          export async function deleteCustomFreq(id: string): Promise<void> {
            await app.messageWebview("freqDelete", id);
            await refreshCustomFreq();
          }

          // ---------- zip ----------

          interface ZipEntry {
            name: string;
            method: number;
            csize: number;
            offset: number;
          }

          function listZip(buf: ArrayBuffer): ZipEntry[] {
            const v = new DataView(buf);
            let eocd = -1;
            const stop = Math.max(0, buf.byteLength - 22 - 65535);
            for (let i = buf.byteLength - 22; i >= stop; i--) {
              if (v.getUint32(i, true) === 0x06054b50) {
                eocd = i;
                break;
              }
            }
            if (eocd < 0) throw new Error("Это не zip-архив.");
            const count = v.getUint16(eocd + 10, true);
            let p = v.getUint32(eocd + 16, true);
            const entries: ZipEntry[] = [];
            for (let n = 0; n < count; n++) {
              if (v.getUint32(p, true) !== 0x02014b50) break;
              const method = v.getUint16(p + 10, true);
              const csize = v.getUint32(p + 20, true);
              const nameLen = v.getUint16(p + 28, true);
              const extraLen = v.getUint16(p + 30, true);
              const commentLen = v.getUint16(p + 32, true);
              const offset = v.getUint32(p + 42, true);
              const name = new TextDecoder().decode(new Uint8Array(buf, p + 46, nameLen));
              entries.push({ name, method, csize, offset });
              p += 46 + nameLen + extraLen + commentLen;
            }
            return entries;
          }

          async function readEntry(buf: ArrayBuffer, e: ZipEntry): Promise<string> {
            const v = new DataView(buf);
            const nameLen = v.getUint16(e.offset + 26, true);
            const extraLen = v.getUint16(e.offset + 28, true);
            const raw = new Uint8Array(buf, e.offset + 30 + nameLen + extraLen, e.csize);
            if (e.method === 0) return new TextDecoder().decode(raw);
            if (e.method !== 8) throw new Error("Неподдерживаемое сжатие в архиве.");
            const stream = new Blob([raw])
              .stream()
              .pipeThrough(new DecompressionStream("deflate-raw"));
            return await new Response(stream).text();
          }

          // ---------- table ----------

          function fnv(s: string): number {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
          }

          function toBase64(bytes: Uint8Array): string {
            let out = "";
            for (let i = 0; i < bytes.length; i += 0x8000) {
              out += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
            }
            return btoa(out);
          }

          /** Returns how many entries were stored. `onProgress` gets short messages for the user. */
          export async function importFreqDictionary(
            file: File,
            onProgress: (message: string) => void,
          ): Promise<number> {
            onProgress("Чтение архива...");
            const buf = await file.arrayBuffer();
            const entries = listZip(buf);
            const indexEntry = entries.find((e) => e.name === "index.json");
            let title = file.name.replace(/\.zip$/i, "");
            if (indexEntry !== undefined) {
              try {
                const index = JSON.parse(await readEntry(buf, indexEntry)) as { title?: string };
                if (typeof index.title === "string" && index.title !== "") title = index.title;
              } catch (_e) {
                // the file name is used
              }
            }
            const banks = entries
              .filter((e) => /(^|\/)term_meta_bank_\d+\.json$/.test(e.name))
              .sort((a, b) => a.name.localeCompare(b.name));
            if (banks.length === 0) {
              throw new Error("В архиве нет частотных данных (term_meta_bank).");
            }

            const best = new Map<number, [number, number]>();
            onProgress("Обработка словаря...");
            for (const bank of banks) {
              const rows = JSON.parse(await readEntry(buf, bank)) as unknown[][];
              for (const row of rows) {
                if (row[1] !== "freq" || typeof row[0] !== "string") continue;
                const term = row[0];
                const data = row[2] as unknown;
                let key: number;
                let freq: unknown;
                if (typeof data === "object" && data !== null && "reading" in data) {
                  const d = data as { reading: string; frequency: unknown };
                  key = fnv(term + "|" + d.reading);
                  freq = d.frequency;
                } else {
                  key = fnv(term);
                  freq = data;
                }
                const isObject = typeof freq === "object" && freq !== null;
                const rank = isObject
                  ? Number((freq as { value: unknown }).value)
                  : Math.trunc(Number(freq));
                if (!Number.isFinite(rank) || rank <= 0) continue;
                const kana =
                  isObject &&
                  String((freq as { displayValue?: unknown }).displayValue ?? "").endsWith("\u32d5");
                const slot = best.get(key) ?? [0, 0];
                const i = kana ? 1 : 0;
                if (slot[i] === 0 || rank < slot[i]) slot[i] = rank;
                best.set(key, slot);
              }
            }
            if (best.size === 0) {
              throw new Error("В архиве нет частотных данных (term_meta_bank).");
            }

            const keys = Array.from(best.keys()).sort((a, b) => a - b);
            const flat = new Uint32Array(keys.length * 3);
            keys.forEach((k, i) => {
              const slot = best.get(k) as [number, number];
              flat[i * 3] = k;
              flat[i * 3 + 1] = slot[0];
              flat[i * 3 + 2] = slot[1];
            });
            const bytes = new Uint8Array(flat.buffer);

            const slug = title.replace(/[^A-Za-z0-9]+/g, "").slice(0, 16);
            const id = "custom_" + (slug === "" ? "dict" : slug) + "_" + Date.now().toString(36);
            const total = Math.max(1, Math.ceil(bytes.length / SAVE_CHUNK));
            for (let seq = 0; seq < total; seq++) {
              onProgress("Сохранение в приложение... " + Math.round(((seq + 1) / total) * 100) + "%");
              const part = bytes.subarray(seq * SAVE_CHUNK, (seq + 1) * SAVE_CHUNK);
              await app.messageWebview("freqSave", {
                id,
                name: title,
                seq,
                total,
                data: toBase64(part),
              });
            }
            await refreshCustomFreq();
            return keys.length;
          }
          '''
          FREQ_LOOKUP_TS = r'''import { FREQ_DICTS } from "extension/background/frequencyData";
          import { FREQ_DICT_LIST } from "lib/freqDictList";
          import Config from "lib/config";

          interface FreqTable {
            id: string;
            name: string;
            label: string;
            data: Uint32Array;
          }

          /** Reads dictionaries that the user imported in the app. Set by the platform code. */
          export interface CustomFreqLoader {
            index(): Promise<{ id: string; name: string; size: number }[]>;
            /** base64 of `length` bytes starting at `offset` */
            read(id: string, offset: number, length: number): Promise<string>;
          }

          const CHUNK = 393216;
          const CUSTOM_REFRESH_MS = 15000;

          let builtin: FreqTable[] | undefined;
          let custom: FreqTable[] = [];
          let customAt = 0;
          let customLoading: Promise<void> | undefined;
          let loader: CustomFreqLoader | undefined;

          export function setCustomFreqLoader(l: CustomFreqLoader): void {
            loader = l;
          }

          function decode(b64: string): Uint32Array {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Uint32Array(bytes.buffer);
          }

          function hash(s: string): number {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
          }

          /** Returns index of the record (3 numbers: key, rank, kana rank) */
          function find(t: Uint32Array, key: number): number | undefined {
            let lo = 0;
            let hi = t.length / 3 - 1;
            while (lo <= hi) {
              const mid = (lo + hi) >>> 1;
              const k = t[mid * 3];
              if (k === key) return mid * 3;
              if (k < key) lo = mid + 1;
              else hi = mid - 1;
            }
            return undefined;
          }

          function builtinTables(): FreqTable[] {
            if (builtin === undefined) {
              builtin = FREQ_DICTS.map((d) => ({
                id: d.id,
                name: d.name,
                label: FREQ_DICT_LIST.find((x) => x.id === d.id)?.label ?? d.name,
                data: decode(d.data),
              }));
            }
            return builtin;
          }

          async function refreshCustom(): Promise<void> {
            if (loader === undefined) return;
            if (customLoading !== undefined) return customLoading;
            if (Date.now() - customAt < CUSTOM_REFRESH_MS) return;
            const l = loader;
            customLoading = (async () => {
              try {
                const list = await l.index();
                const next: FreqTable[] = [];
                for (const item of list) {
                  const prev = custom.find(
                    (t) => t.id === item.id && t.data.byteLength === item.size,
                  );
                  if (prev !== undefined) {
                    next.push(prev);
                    continue;
                  }
                  const bytes = new Uint8Array(item.size);
                  for (let off = 0; off < item.size; off += CHUNK) {
                    const b64 = await l.read(item.id, off, Math.min(CHUNK, item.size - off));
                    const bin = atob(b64);
                    for (let i = 0; i < bin.length; i++) bytes[off + i] = bin.charCodeAt(i);
                  }
                  next.push({
                    id: item.id,
                    name: item.name,
                    label: item.name,
                    data: new Uint32Array(bytes.buffer),
                  });
                }
                custom = next;
              } catch (e) {
                console.error("Could not load imported frequency dictionaries", e);
              } finally {
                customAt = Date.now();
                customLoading = undefined;
              }
            })();
            return customLoading;
          }

          async function allTables(): Promise<FreqTable[]> {
            await refreshCustom();
            return [...builtinTables(), ...custom];
          }

          async function userLabels(): Promise<Record<string, string>> {
            try {
              const config = await Config.instance.get();
              const raw = config.get("freq.labels");
              const parsed: unknown = JSON.parse(typeof raw === "string" && raw !== "" ? raw : "{}");
              return typeof parsed === "object" && parsed !== null
                ? (parsed as Record<string, string>)
                : {};
            } catch (_e) {
              return {};
            }
          }

          export interface FrequencyRequest {
            term: string;
            reading: string;
          }

          export interface FrequencyResult {
            name: string;
            /** e.g. ["1065㋕", "59854"] */
            values: string[];
          }

          export async function lookupFrequency(
            req: FrequencyRequest,
          ): Promise<FrequencyResult[]> {
            const tables = await allTables();
            const labels = await userLabels();
            const results: FrequencyResult[] = [];
            for (const t of tables) {
              const i =
                find(t.data, hash(req.term + "|" + req.reading)) ??
                find(t.data, hash(req.term));
              if (i !== undefined) {
                const items: [number, string][] = [];
                if (t.data[i + 1] > 0) items.push([t.data[i + 1], String(t.data[i + 1])]);
                if (t.data[i + 2] > 0) items.push([t.data[i + 2], t.data[i + 2] + "㋕"]);
                items.sort((a, b) => a[0] - b[0]);
                results.push({ name: labels[t.id] ?? t.label, values: items.map((x) => x[1]) });
              }
            }
            return results;
          }

          export interface RankRequest {
            /** dictionary form */
            t: string;
            /** reading in hiragana */
            r: string;
            /** the word is written in kana in the text */
            k: boolean;
          }

          /** Rank of each word in one dictionary (by id). 0 = no rank. */
          export async function lookupRanks(
            dict: string,
            items: RankRequest[],
          ): Promise<number[]> {
            const tables = await allTables();
            let table = tables.find((t) => t.id === dict);
            if (table === undefined) {
              // values of the old settings: "wn" = WebNovel, anything else = the general list
              table =
                dict === "wn"
                  ? tables.find((t) => /webnovel/i.test(t.name))
                  : tables.find((t) => !/webnovel/i.test(t.name));
            }
            if (table === undefined) return items.map(() => 0);
            const data = table.data;
            return items.map((it) => {
              const i = find(data, hash(it.t + "|" + it.r)) ?? find(data, hash(it.t));
              if (i === undefined) return 0;
              const kanjiRank = data[i + 1];
              const kanaRank = data[i + 2];
              if (it.k) return kanaRank > 0 ? kanaRank : kanjiRank;
              return kanjiRank > 0 ? kanjiRank : kanaRank;
            });
          }
          '''
