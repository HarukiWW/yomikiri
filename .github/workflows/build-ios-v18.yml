              @State private var textParts = 0
              @State private var imageParts = 0
              @State private var trackName = ""
              @State private var lookupWord = ""
              @State private var lookupEntries: [LookupEntry] = []
              @State private var showLookup = false
              @State private var showImporter = false
              @State private var showSubTools = false
              @State private var subDelay: Double = 0
              @State private var refStarts: [Double] = []     // timings of the embedded track, collected while playing
              @State private var refKeys = Set<Int>()
              @State private var syncMessage = ""
              @State private var videoSize = CGSize.zero

              private var delayKey: String { "subdelay." + url.lastPathComponent }

              var body: some View {
                  // The engine must be chosen before KSPlayer creates its player layer,
                  // so it is set here, when this screen is actually shown.
                  let _ = NativeVideoEngine.prepare(for: url)
