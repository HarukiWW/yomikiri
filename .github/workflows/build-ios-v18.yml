              private func toolButton(_ title: String, _ action: @escaping () -> Void) -> some View {
                  Button(action: action) {
                      Text(title)
                          .font(.caption.weight(.semibold))
                          .foregroundColor(.white)
                          .fixedSize()
                          .padding(.horizontal, 10)
                          .padding(.vertical, 6)
                          .background(Color.black.opacity(0.6))
                          .cornerRadius(8)
                  }
