          function katakanaToHiragana(s: string): string {
            let out = "";
            for (const ch of s) {
              const c = ch.codePointAt(0) ?? 0;
              out += c >= 0x30a1 && c <= 0x30f6 ? String.fromCodePoint(c - 0x60) : ch;
