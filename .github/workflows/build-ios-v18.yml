          I18N_TS = r'''/**
           * The interface is written in Russian. When English is chosen, every Russian text of the page
           * is replaced using the table in `i18nEn.ts`. Texts are restored when Russian is chosen again.
           */
          import { EN_MAP } from "lib/i18nEn";

          const CYRILLIC = /[А-Яа-яЁё]/;
          const ATTRIBUTES = ["placeholder", "title", "aria-label", "alt"];
          const SKIP_PARENTS = new Set(["SCRIPT", "STYLE", "TEXTAREA", "NOSCRIPT"]);
          const KEYS = Object.keys(EN_MAP)
            .filter((k) => k.length >= 8)
            .sort((a, b) => b.length - a.length);

          interface Saved {
            src: string;
            out: string;
          }

          interface DocState {
            lang: string;
            observer: MutationObserver | undefined;
            texts: WeakMap<Text, Saved>;
            attrs: WeakMap<Element, Record<string, Saved>>;
            nodes: WeakRef<Text>[];
            elements: WeakRef<Element>[];
          }

          const states = new WeakMap<Document, DocState>();

          export function translateString(s: string): string {
            if (!CYRILLIC.test(s)) return s;
            const lead = /^\s*/.exec(s)?.[0] ?? "";
            const trail = /\s*$/.exec(s)?.[0] ?? "";
            const core = s.trim().replace(/\s+/g, " ");
            const exact = EN_MAP[core];
            if (exact !== undefined) return lead + exact + trail;
            const duration = /^(?:(\d+) ч )?(\d+) мин$/.exec(core);
            if (duration !== null) {
              const hours = duration[1] !== undefined ? duration[1] + " h " : "";
              return lead + hours + duration[2] + " min" + trail;
            }
            let out = core;
            for (const key of KEYS) {
              if (out.includes(key)) out = out.split(key).join(EN_MAP[key]);
            }
            return out === core ? s : lead + out + trail;
          }

          function translateText(node: Text, st: DocState): void {
            if (node.parentElement !== null && SKIP_PARENTS.has(node.parentElement.tagName)) {
              return;
            }
            const saved = st.texts.get(node);
            if (saved !== undefined && node.data === saved.out) return;
            const out = translateString(node.data);
            if (out === node.data) return;
            st.texts.set(node, { src: node.data, out });
            st.nodes.push(new WeakRef(node));
            node.data = out;
          }

          function translateAttribute(el: Element, name: string, st: DocState): void {
            const value = el.getAttribute(name);
            if (value === null) return;
            const record = st.attrs.get(el) ?? {};
            const saved = record[name];
            if (saved !== undefined && value === saved.out) return;
            const out = translateString(value);
            if (out === value) return;
            record[name] = { src: value, out };
            st.attrs.set(el, record);
            st.elements.push(new WeakRef(el));
            el.setAttribute(name, out);
          }

          function translateSubtree(root: Node, st: DocState): void {
            if (root.nodeType === Node.TEXT_NODE) {
              translateText(root as Text, st);
              return;
            }
            if (root.nodeType !== Node.ELEMENT_NODE && root.nodeType !== Node.DOCUMENT_NODE) {
              return;
            }
            const doc = root.ownerDocument ?? (root as Document);
            const walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const texts: Text[] = [];
            for (let n = walker.nextNode(); n !== null; n = walker.nextNode()) {
              texts.push(n as Text);
            }
            texts.forEach((t) => translateText(t, st));
            if (root.nodeType === Node.ELEMENT_NODE) {
              const el = root as Element;
              ATTRIBUTES.forEach((a) => translateAttribute(el, a, st));
            }
            const selector = ATTRIBUTES.map((a) => "[" + a + "]").join(",");
            const parent = root.nodeType === Node.ELEMENT_NODE ? (root as Element) : doc;
            parent.querySelectorAll(selector).forEach((el) => {
              ATTRIBUTES.forEach((a) => translateAttribute(el, a, st));
            });
          }

          function restore(st: DocState): void {
            for (const ref of st.nodes) {
              const node = ref.deref();
              const saved = node === undefined ? undefined : st.texts.get(node);
              if (node !== undefined && saved !== undefined && node.data === saved.out) {
                node.data = saved.src;
              }
            }
            for (const ref of st.elements) {
              const el = ref.deref();
              const record = el === undefined ? undefined : st.attrs.get(el);
              if (el === undefined || record === undefined) continue;
              for (const [name, saved] of Object.entries(record)) {
                if (el.getAttribute(name) === saved.out) el.setAttribute(name, saved.src);
              }
            }
            st.nodes = [];
            st.elements = [];
          }

          export function setLanguage(doc: Document, lang: string): void {
            let st = states.get(doc);
            if (st === undefined) {
              st = {
                lang: "ru",
                observer: undefined,
                texts: new WeakMap(),
                attrs: new WeakMap(),
                nodes: [],
                elements: [],
              };
              states.set(doc, st);
            }
            const state = st;
            const want = lang === "en" ? "en" : "ru";
            if (state.lang === want) return;
            state.lang = want;
            state.observer?.disconnect();
            state.observer = undefined;
            if (want === "ru") {
              restore(state);
              return;
            }
            const root = doc.documentElement;
            translateSubtree(root, state);
            state.observer = new MutationObserver((mutations) => {
              for (const m of mutations) {
                if (m.type === "childList") {
                  m.addedNodes.forEach((n) => translateSubtree(n, state));
                } else if (m.type === "characterData") {
                  translateSubtree(m.target, state);
                } else if (m.type === "attributes" && m.attributeName !== null) {
                  translateAttribute(m.target as Element, m.attributeName, state);
                }
              }
            });
            state.observer.observe(root, {
              childList: true,
              subtree: true,
              characterData: true,
              attributes: true,
              attributeFilter: ATTRIBUTES,
            });
          }
