            {/if}
          </div>
          """
          if "<style>" in s:
              s = s.replace("<style>", html_addition + "\n<style>", 1)
          else:
              s += html_addition
          p.write_text(s)

          # ======================= Content Script Highlighting =======================
          (ext / "content/highlight.ts").write_text("""
          import { FREQ_DICTS } from "extension/background/frequencyData";
          import { Config } from "lib/config";

          interface FreqTable {
            name: string;
            data: Uint32Array;
          }

          let tables: FreqTable[] | undefined;
          let minedWords = new Set<string>();

          function decode(b64: string): Uint32Array {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Uint32Array(bytes.buffer);
          }

          function hash(s: string): number {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
          }

          function find(t: Uint32Array, key: number): number | undefined {
            let lo = 0;
            let hi = t.length / 3 - 1;
            while (lo <= hi) {
              const mid = (lo + hi) >>> 1;
              const k = t[mid * 3];
              if (k === key) return mid * 3;
              if (k < key) lo = mid + 1;
              else hi = mid - 1;
            }
            return undefined;
          }

          function getFreq(term: string, dictName: string): number | null {
            if (!tables) {
              tables = FREQ_DICTS.map((d) => ({ name: d.name, data: decode(d.data) }));
            }
            const t = tables.find(tbl => tbl.name.toLowerCase().includes(dictName === "webnovel" ? "webnovel" : "global") || tbl.name.toLowerCase().includes(dictName));
            if (!t) return null;
            
            const i = find(t.data, hash(term + "|" + term)) ?? find(t.data, hash(term));
            if (i !== undefined) {
              return t.data[i + 1] > 0 ? t.data[i + 1] : (t.data[i + 2] > 0 ? t.data[i + 2] : null);
            }
            return null;
          }

          async function loadSettings() {
            const c = await Config.instance.get();
            return {
              enabled: c.get("freq.highlight.enabled") ?? false,
              dict: c.get("freq.highlight.dict") ?? "global",
              min: c.get("freq.highlight.min") ?? 3000,
              max: c.get("freq.highlight.max") ?? 8000,
              color: c.get("freq.highlight.color") ?? "#ff9f0a"
            };
          }

          async function getMinedWords(): Promise<Set<string>> {
            return new Promise((resolve) => {
              const rt = (globalThis as any).chrome?.runtime;
              if (!rt?.sendMessage) return resolve(new Set());
              rt.sendMessage({ key: "getAllMined", request: null }, (resp: any) => {
                if (resp?.success && Array.isArray(resp.resp)) {
                  resolve(new Set(resp.resp));
                } else {
                  resolve(new Set());
                }
              });
            });
          }

          const BLOCKS = "p, .p, .text, #novel_honbun, div";

          async function highlightPage() {
            const settings = await loadSettings();
            if (!settings.enabled) {
              removeHighlights();
              return;
            }
            minedWords = await getMinedWords();
            
            const walker = document.createTreeWalker(
              document.body,
              NodeFilter.SHOW_TEXT,
              {
                acceptNode: (node) => {
                  if (!node.parentElement) return NodeFilter.FILTER_REJECT;
                  if (node.parentElement.closest(".yomikiri-freq-highlight")) return NodeFilter.FILTER_REJECT;
                  if (node.parentElement.closest("script, style, noscript, .yomikiri-popup")) return NodeFilter.FILTER_REJECT;
                  if (node.parentElement.closest(BLOCKS)) return NodeFilter.FILTER_ACCEPT;
                  return NodeFilter.FILTER_SKIP;
                }
              }
            );

            const nodesToProcess: Text[] = [];
            let n: Node | null;
            while ((n = walker.nextNode())) {
              nodesToProcess.push(n as Text);
            }

            const segmenter = typeof Intl !== "undefined" && "Segmenter" in Intl ? new (Intl as any).Segmenter("ja", { granularity: "word" }) : null;

            for (const textNode of nodesToProcess) {
              const text = textNode.nodeValue;
              if (!text || !/[\u3040-\u30ff\u3400-\u9fff]/.test(text)) continue;

              const segments = segmenter ? Array.from(segmenter.segment(text) as Iterable<{ segment: string, isWordLike: boolean }>) : [{ segment: text, isWordLike: true }];
              
              const frag = document.createDocumentFragment();
              let hasHighlights = false;

              for (const seg of segments) {
                if (!seg.isWordLike) {
                  frag.appendChild(document.createTextNode(seg.segment));
                  continue;
                }
                const word = seg.segment;
                const freq = getFreq(word, settings.dict);
                
                if (freq !== null && freq >= settings.min && freq <= settings.max && !minedWords.has(word)) {
                  const span = document.createElement("span");
                  span.className = "yomikiri-freq-highlight";
                  span.style.color = settings.color;
                  span.textContent = word;
                  frag.appendChild(span);
                  hasHighlights = true;
                } else {
                  frag.appendChild(document.createTextNode(word));
                }
              }

              if (hasHighlights && textNode.parentNode) {
                textNode.parentNode.replaceChild(frag, textNode);
              }
            }
          }

          function removeHighlights() {
            const spans = document.querySelectorAll("span.yomikiri-freq-highlight");
            spans.forEach(span => {
              const parent = span.parentNode;
              if (parent) {
                parent.replaceChild(document.createTextNode(span.textContent || ""), span);
                parent.normalize();
              }
            });
          }

          let highlightTimeout: number | undefined;
          function scheduleHighlight() {
            if (highlightTimeout) clearTimeout(highlightTimeout);
            highlightTimeout = window.setTimeout(() => {
              highlightPage().catch(console.error);
            }, 500);
          }

          window.addEventListener("message", (event) => {
            if (event.data?.type === "YOMIKIRI_FREQ_HIGHLIGHT_UPDATE") {
              scheduleHighlight();
            }
          });

          const observer = new MutationObserver(() => {
            scheduleHighlight();
          });
          observer.observe(document.body, { childList: true, subtree: true });

          scheduleHighlight();
          """)

          p = ext / "content/index.ts"
          s = p.read_text()
          p.write_text('import "./highlight";\n' + s)

          print("new features patch OK")
          PY

      - name: Pre-generate files that Xcode expects to already exist
        working-directory: src
        run: |
          pnpm generate:release
          pnpm build:ios

      - name: Build iOS app (unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          PROJ=safari/Yomikiri.xcodeproj
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "
          import json, sys
          s = json.load(sys.stdin)['project']['schemes']
          bad = ('extension', 'tokenizer', 'test')
          good = [x for x in s if 'yomikiri' in x.lower() and not any(b in x.lower() for b in bad)]
          print((good or s)[0])
          ")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.1 CURRENT_PROJECT_VERSION=1.1 \
            build 2>&1 | tee xcodebuild.log

      - name: Package .ipa
        working-directory: src
        env:
          GROUP_PREFIX: group.e9b3f7cfcd7710ea
          TEAM_ID: L3R6H56C8T
          EMBED_ENTITLEMENTS: ${{ inputs.entitlements }}
          FULL_ENTITLEMENTS: ${{ inputs.full_entitlements }}
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          APPDIR="ipa/Payload/$(basename "$APP")"
          PLIST="$APPDIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Yomikiri-RU" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Yomikiri-RU" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Yomikiri-RU" "$PLIST" || true
          # version 1.1 in the app, the extensions and the frameworks
          for P in "$PLIST" "$APPDIR"/PlugIns/*.appex/Info.plist "$APPDIR"/Frameworks/*.framework/Info.plist; do
            [ -f "$P" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.1" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.1" "$P"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 1.1" "$P" || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1.1" "$P"
          done
          if [ "$EMBED_ENTITLEMENTS" != "false" ]; then
            # Put the App Group into the entitlements of the app and the extensions,
            # so the signing tool keeps it and they can share settings and statistics.
            APP_GROUPS_XML="<string>$GROUP_PREFIX.1</string>"
            KEYCHAIN_XML=""
            if [ "$FULL_ENTITLEMENTS" != "false" ]; then
              # all groups of the profile (the app and the extensions can then find a common one)
              # and a shared keychain group, covered by the profile's "TEAM.*" wildcard
              for i in 2 3 4 5; do
                APP_GROUPS_XML="$APP_GROUPS_XML<string>$GROUP_PREFIX.$i</string>"
              done
              KEYCHAIN_XML="<key>keychain-access-groups</key><array><string>$TEAM_ID.yomikiri.shared</string></array>"
            fi
            cat > /tmp/ent.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.application-groups</key>
            <array>$APP_GROUPS_XML</array>
            $KEYCHAIN_XML
          </dict>
          </plist>
          EOF
            for f in "$APPDIR"/Frameworks/*.framework; do
              codesign --force --sign - --timestamp=none "$f"
            done
            for x in "$APPDIR"/PlugIns/*.appex; do
              codesign --force --sign - --timestamp=none --entitlements /tmp/ent.plist "$x"
            done
            codesign --force --sign - --timestamp=none --entitlements /tmp/ent.plist "$APPDIR"
            for x in "$APPDIR" "$APPDIR"/PlugIns/*.appex; do
              echo "== entitlements of $x"
              codesign -d --entitlements :- "$x" 2>&1 | head -20 || true
            done
          else
            find ipa/Payload \( -name "*.appex" -o -name "*.framework" -o -name "*.app" \) -print0 | xargs -0 -I{} codesign --remove-signature "{}" || true
          fi
          (cd ipa && zip -qry ../Yomikiri-RU-v035.ipa Payload)
          ls -la Yomikiri-RU-v035.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yomikiri-RU-v035-ipa
          path: src/Yomikiri-RU-v035.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v035
          path: src/xcodebuild.log
          if-no-files-found: ignore
