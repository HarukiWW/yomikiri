              window.postMessage({ type: "YOMIKIRI_FREQ_HIGHLIGHT_UPDATE" }, "*");
            }
          """
          s = s.replace("</script>", script_addition + "\n</script>", 1)
          
          html_addition = """
          <div style="margin-top: 20px; padding: 10px; border-top: 1px solid var(--border);">
