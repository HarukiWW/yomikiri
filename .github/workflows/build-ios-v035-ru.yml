name: Build iOS v0.3.5 (Russian dictionary)

# Builds the official v0.3.5 release code (same code as the App Store version)
# with the Russian dictionary and sideload-friendly fixes.

on:
  workflow_dispatch:
    inputs:
      english:
        description: 'Control build: keep the ORIGINAL English dictionary'
        type: boolean
        default: false

env:
  RELEASE_COMMIT: 0f9ea39181d1dc66ce715665f5ef08b494e261a1

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout our files (dictionary converter)
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Checkout v0.3.5 release code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: src

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make Node 20 the default node (Xcode scripts use a fixed PATH)
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          sudo ln -sf "$(command -v npx)" /usr/local/bin/npx
          /usr/local/bin/node --version

      - name: Install cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install pnpm deps
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Download Russian dictionary from release "dict"
        if: ${{ !inputs.english }}
        run: |
          mkdir -p ours/custom-dict
          gh release download dict --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir ours/custom-dict --clobber
          ls -la ours/custom-dict

      - name: Download original JMdict files (JMnedict is still needed)
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator download

      - name: Replace JMdict with Russian dictionary
        if: ${{ !inputs.english }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ls -la "$ORIG"
          ZIP=$(ls ours/custom-dict/*.zip | head -n1)
          python3 ours/custom-dict/kolobok_to_jmdict.py "$ZIP" /tmp/jmdict_ru.xml --orig "$ORIG"
          mv /tmp/jmdict_ru.xml "$ORIG"
          ls -la "$ORIG"

      - name: Generate yomikiri dictionary
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator generate

      - name: Patch Swift (work without App Group)
        run: |
          python3 - <<'PY'
          import pathlib, re
          d = pathlib.Path("src/safari/YomikiriTokenizer/YomikiriTokenizer")

          p = d / "Utils.swift"
          s = p.read_text()
          m = re.search(r"public func getSharedDirectory\(\) throws -> URL \{.*?\n\}\n", s, re.S)
          assert m, "getSharedDirectory() not found in Utils.swift"
          new = '''public func getSharedDirectory() throws -> URL {
              let fm = FileManager.default
              if let dir = fm.containerURL(forSecurityApplicationGroupIdentifier: APP_GROUP_ID) {
                  return dir
              }
              // Fallback for sideloaded builds without App Group access
              guard let dir = fm.urls(for: .applicationSupportDirectory, in: .userDomainMask).first else {
                  throw YomikiriTokenizerError.CouldNotAccessDirectory
              }
              if !fm.fileExists(atPath: dir.path) {
                  try fm.createDirectory(at: dir, withIntermediateDirectories: true)
              }
              return dir
          }
          '''
          p.write_text(s[: m.start()] + new + s[m.end():])

          p = d / "Storage.swift"
          s = p.read_text()
          m = re.search(r"private func getSharedDefaults\(\) -> Result<UserDefaults, YomikiriTokenizerError> \{.*?\n\}\n", s, re.S)
          assert m, "getSharedDefaults() not found in Storage.swift"
          new = '''private func getSharedDefaults() -> Result<UserDefaults, YomikiriTokenizerError> {
              if let sharedDefault = UserDefaults(suiteName: APP_GROUP_ID) {
                  return .success(sharedDefault)
              }
              return .success(UserDefaults.standard)
          }
          '''
          p.write_text(s[: m.start()] + new + s[m.end():])
          print("patched OK")
          PY

      - name: Patch TypeScript (add "audio" field type)
        run: |
          python3 - <<'PY'
          import pathlib

          d = pathlib.Path("src/main/src/lib/anki")

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          # template.ts: new field type "audio"
          p = d / "template.ts"
          s = p.read_text()
          s = replace_once(s, '  link: FieldBase<"link">;\n}', '  link: FieldBase<"link">;\n  audio: FieldBase<"audio">;\n}', "types")
          s = replace_once(s, '  "url",\n  "link",\n];', '  "url",\n  "link",\n  "audio",\n];', "type list")
          s = replace_once(s, '  link: "link",\n};', '  link: "link",\n  audio: "audio",\n};', "labels")
          s = replace_once(s, '    content === "link"\n  ) {', '    content === "link" ||\n    content === "audio"\n  ) {', "new field")
          p.write_text(s)

          # ankiBuilder.ts: builder for "audio"
          p = d / "ankiBuilder.ts"
          s = p.read_text()
          s += """
          /**
           * Audio from JapanesePod101.
           *
           * AnkiMobile downloads a field's content by itself if the whole field is a link
           * to an audio file, and replaces it with a [sound:...] tag.
           * The link must end with a known file extension, so a fake argument is appended.
           */
          const JPOD101_URL = "https://assets.languagepod101.com/dictionary/japanese/audiomp3.php";
          /** Size of the 'audio not available' clip that JapanesePod101 returns. */
          const JPOD101_PLACEHOLDER_SIZE = 52288;

          async function findJpod101Audio(word: string, reading: string): Promise<string> {
            const query = `?kanji=${encodeURIComponent(word)}&kana=${encodeURIComponent(reading)}`;
            try {
              const resp = await fetch(JPOD101_URL + query);
              if (!resp.ok) return "";
              const buf = await resp.arrayBuffer();
              if (buf.byteLength === JPOD101_PLACEHOLDER_SIZE || buf.byteLength < 2000) {
                return "";
              }
            } catch (err) {
              // Could not verify (network or cross-origin restrictions).
              // Still give the link to AnkiMobile.
              console.warn("Could not check JapanesePod101 audio:", err);
            }
            return JPOD101_URL + query + "&fakePath=audio.mp3";
          }

          addBuilder("audio", (_opts, data) => {
            const token = data.tokenized.tokens[data.tokenized.tokenIdx];
            const word = token.base;
            const reading = getReadingForForm(data.entry, word, false).reading || word;
            return Utils.PromiseWithProgress.fromPromise(
              findJpod101Audio(word, reading),
              "Finding audio...",
            );
          });
          """
          p.write_text(s)
          # config.ts: bake the Anki template into the defaults.
          # Sideloaded builds have no shared storage, so the extension cannot see
          # settings saved in the app. Stored settings still override these defaults.
          import json
          DEFAULT_TEMPLATE = {
              "deck": "yomikiri",
              "notetype": "kaishi mining",
              "tags": "yomikiri-ru",
              "fields": [
                  {"name": "Word", "content": "word", "form": "as-is", "style": "basic"},
                  {"name": "Reading", "content": ""},
                  {"name": "Meaning", "content": "meaning", "full_format": "numbered", "full_pos": False, "full_max_item": 0, "single_pos": False, "single_max_item": 0},
                  {"name": "Sentence", "content": "sentence", "style": "basic", "word": "none"},
                  {"name": "SentenceMeaning", "content": "translated-sentence"},
                  {"name": "Audio", "content": "audio"},
                  {"name": "SectenceAudio", "content": ""},
                  {"name": "Image", "content": ""},
                  {"name": "Furigana", "content": "word", "form": "main-dict-form", "style": "furigana-anki"},
              ],
          }
          override = pathlib.Path("ours/custom-dict/anki_template.json")
          template = json.loads(override.read_text()) if override.exists() else DEFAULT_TEMPLATE
          p = pathlib.Path("src/main/src/lib/config.ts")
          s = p.read_text()
          old = '  "anki.anki_template": null,\n  "anki.enabled": false,'
          assert s.count(old) == 1, "default anki options not found in config.ts"
          tpl_ts = json.dumps(template, indent=2, ensure_ascii=False).replace("\n", "\n  ")
          s = s.replace(old, '  "anki.anki_template": ' + tpl_ts + ',\n  "anki.enabled": true,')
          p.write_text(s)

          # translate.ts: translate sentences into Russian instead of English
          p = pathlib.Path("src/main/src/platform/common/translate.ts")
          s = p.read_text()
          s = replace_once(s, 'const targetLang = "en";', 'const targetLang = "ru";', "translate target language")
          p.write_text(s)

          print("audio patch OK")
          PY

      - name: Patch CSS (dark theme by default)
        run: |
          python3 - <<'PY'
          import pathlib, re

          p = pathlib.Path("src/main/src/global.css")
          s = p.read_text()

          dark = {
              "text": "#e8e8e8",
              "text-light": "#a0a0a5",
              "text-faint": "#6e6e73",
              "text-success": "#5fd068",
              "text-warn": "#ff6b6b",
              "border": "#3a3a3c",
              "background": "#1c1c1e",
              "background-alt-light": "#242426",
              "background-alt": "#2c2c2e",
              "background-dark": "#48484a",
              "input": "#2c2c2e",
              "selected-blue": "#0a84ff",
              "button-light": "#8e8e93",
              "button-bg": "#3a3a3c",
          }
          for name, value in dark.items():
              pattern = re.compile(r"^(  --" + re.escape(name) + r": )[^;]+;", re.M)
              assert len(pattern.findall(s)) == 1, "css variable not found once: " + name
              s = pattern.sub(lambda m: m.group(1) + value + ";", s)

          old = "  --edge-horizontal-padding: 8px;"
          assert s.count(old) == 1, "edge padding var not found"
          s = s.replace(old, old + "\n  color-scheme: dark;")
          p.write_text(s)
          print("dark theme OK")
          PY

      - name: Pre-generate files that Xcode expects to already exist
        working-directory: src
        run: |
          pnpm generate:release
          pnpm build:ios

      - name: Build iOS app (unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          PROJ=safari/Yomikiri.xcodeproj
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "
          import json, sys
          s = json.load(sys.stdin)['project']['schemes']
          bad = ('extension', 'tokenizer', 'test')
          good = [x for x in s if 'yomikiri' in x.lower() and not any(b in x.lower() for b in bad)]
          print((good or s)[0])
          ")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package .ipa
        working-directory: src
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          find ipa/Payload \( -name "*.appex" -o -name "*.framework" -o -name "*.app" \) -print0 | xargs -0 -I{} codesign --remove-signature "{}" || true
          (cd ipa && zip -qry ../Yomikiri-RU-v035.ipa Payload)
          ls -la Yomikiri-RU-v035.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yomikiri-RU-v035-ipa
          path: src/Yomikiri-RU-v035.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v035
          path: src/xcodebuild.log
          if-no-files-found: ignore
