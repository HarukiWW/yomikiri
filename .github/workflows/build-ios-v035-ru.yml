name: Build iOS v0.3.5 (Russian dictionary)

# Builds the official v0.3.5 release code (same code as the App Store version)
# with the Russian dictionary and sideload-friendly fixes.

on:
  workflow_dispatch:
    inputs:
      english:
        description: 'Control build: keep the ORIGINAL English dictionary'
        type: boolean
        default: false

env:
  RELEASE_COMMIT: 0f9ea39181d1dc66ce715665f5ef08b494e261a1

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout our files (dictionary converter)
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Checkout v0.3.5 release code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: src

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make Node 20 the default node (Xcode scripts use a fixed PATH)
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          sudo ln -sf "$(command -v npx)" /usr/local/bin/npx
          /usr/local/bin/node --version

      - name: Install cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install pnpm deps
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Download Russian dictionary from release "dict"
        if: ${{ !inputs.english }}
        run: |
          mkdir -p ours/custom-dict
          gh release download dict --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir ours/custom-dict --clobber
          ls -la ours/custom-dict

      - name: Download original JMdict files (JMnedict is still needed)
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator download

      - name: Replace JMdict with Russian dictionary
        if: ${{ !inputs.english }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ls -la "$ORIG"
          ZIP=$(ls ours/custom-dict/jp-ru-*.zip | head -n1)
          python3 ours/custom-dict/kolobok_to_jmdict.py "$ZIP" /tmp/jmdict_ru.xml --orig "$ORIG"
          mv /tmp/jmdict_ru.xml "$ORIG"
          ls -la "$ORIG"

      - name: Generate yomikiri dictionary
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator generate

      - name: Patch Swift (work without App Group)
        run: |
          python3 - <<'PY'
          import pathlib, re
          d = pathlib.Path("src/safari/YomikiriTokenizer/YomikiriTokenizer")

          p = d / "Utils.swift"
          s = p.read_text()
          m = re.search(r"public func getSharedDirectory\(\) throws -> URL \{.*?\n\}\n", s, re.S)
          assert m, "getSharedDirectory() not found in Utils.swift"
          new = '''public func getSharedDirectory() throws -> URL {
              let fm = FileManager.default
              if let dir = fm.containerURL(forSecurityApplicationGroupIdentifier: APP_GROUP_ID) {
                  return dir
              }
              // Fallback for sideloaded builds without App Group access
              guard let dir = fm.urls(for: .applicationSupportDirectory, in: .userDomainMask).first else {
                  throw YomikiriTokenizerError.CouldNotAccessDirectory
              }
              if !fm.fileExists(atPath: dir.path) {
                  try fm.createDirectory(at: dir, withIntermediateDirectories: true)
              }
              return dir
          }
          '''
          p.write_text(s[: m.start()] + new + s[m.end():])

          p = d / "Storage.swift"
          s = p.read_text()
          m = re.search(r"private func getSharedDefaults\(\) -> Result<UserDefaults, YomikiriTokenizerError> \{.*?\n\}\n", s, re.S)
          assert m, "getSharedDefaults() not found in Storage.swift"
          new = '''private func getSharedDefaults() -> Result<UserDefaults, YomikiriTokenizerError> {
              if let sharedDefault = UserDefaults(suiteName: APP_GROUP_ID) {
                  return .success(sharedDefault)
              }
              return .success(UserDefaults.standard)
          }
          '''
          p.write_text(s[: m.start()] + new + s[m.end():])
          print("patched OK")
          PY

      - name: Patch TypeScript (add "audio" field type)
        run: |
          python3 - <<'PY'
          import pathlib

          d = pathlib.Path("src/main/src/lib/anki")

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          # template.ts: new field type "audio"
          p = d / "template.ts"
          s = p.read_text()
          s = replace_once(s, '  link: FieldBase<"link">;\n}', '  link: FieldBase<"link">;\n  audio: FieldBase<"audio">;\n}', "types")
          s = replace_once(s, '  "url",\n  "link",\n];', '  "url",\n  "link",\n  "audio",\n];', "type list")
          s = replace_once(s, '  link: "link",\n};', '  link: "link",\n  audio: "audio",\n};', "labels")
          s = replace_once(s, '    content === "link"\n  ) {', '    content === "link" ||\n    content === "audio"\n  ) {', "new field")
          p.write_text(s)

          # ankiBuilder.ts: builder for "audio"
          p = d / "ankiBuilder.ts"
          s = p.read_text()
          s += """
          /**
           * Audio from JapanesePod101.
           *
           * AnkiMobile downloads a field's content by itself if the whole field is a link
           * to an audio file, and replaces it with a [sound:...] tag.
           * The link must end with a known file extension, so a fake argument is appended.
           */
          const JPOD101_URL = "https://assets.languagepod101.com/dictionary/japanese/audiomp3.php";
          /** Size of the 'audio not available' clip that JapanesePod101 returns. */
          const JPOD101_PLACEHOLDER_SIZE = 52288;

          async function findJpod101Audio(word: string, reading: string): Promise<string> {
            const query = `?kanji=${encodeURIComponent(word)}&kana=${encodeURIComponent(reading)}`;
            try {
              const resp = await fetch(JPOD101_URL + query);
              if (!resp.ok) return "";
              const buf = await resp.arrayBuffer();
              if (buf.byteLength === JPOD101_PLACEHOLDER_SIZE || buf.byteLength < 2000) {
                return "";
              }
            } catch (err) {
              // Could not verify (network or cross-origin restrictions).
              // Still give the link to AnkiMobile.
              console.warn("Could not check JapanesePod101 audio:", err);
            }
            return JPOD101_URL + query + "&fakePath=audio.mp3";
          }

          addBuilder("audio", (_opts, data) => {
            const token = data.tokenized.tokens[data.tokenized.tokenIdx];
            const word = token.base;
            const reading = getReadingForForm(data.entry, word, false).reading || word;
            return Utils.PromiseWithProgress.fromPromise(
              findJpod101Audio(word, reading),
              "Finding audio...",
            );
          });
          """
          p.write_text(s)
          # config.ts: bake the Anki template into the defaults.
          # Sideloaded builds have no shared storage, so the extension cannot see
          # settings saved in the app. Stored settings still override these defaults.
          import json
          DEFAULT_TEMPLATE = {
              "deck": "mining",
              "notetype": "kaishi mining",
              "tags": "yomikiri-ru",
              "fields": [
                  {"name": "Word", "content": "word", "form": "as-is", "style": "basic"},
                  {"name": "Reading", "content": ""},
                  {"name": "Meaning", "content": "meaning", "full_format": "numbered", "full_pos": False, "full_max_item": 0, "single_pos": False, "single_max_item": 0},
                  {"name": "Sentence", "content": "sentence", "style": "basic", "word": "none"},
                  {"name": "SentenceMeaning", "content": "translated-sentence"},
                  {"name": "Audio", "content": "audio"},
                  {"name": "SectenceAudio", "content": ""},
                  {"name": "Image", "content": ""},
                  {"name": "Furigana", "content": "word", "form": "main-dict-form", "style": "furigana-anki"},
              ],
          }
          override = pathlib.Path("ours/custom-dict/anki_template.json")
          template = json.loads(override.read_text()) if override.exists() else DEFAULT_TEMPLATE
          p = pathlib.Path("src/main/src/lib/config.ts")
          s = p.read_text()
          old = '  "anki.anki_template": null,\n  "anki.enabled": false,'
          assert s.count(old) == 1, "default anki options not found in config.ts"
          tpl_ts = json.dumps(template, indent=2, ensure_ascii=False).replace("\n", "\n  ")
          s = s.replace(old, '  "anki.anki_template": ' + tpl_ts + ',\n  "anki.enabled": true,')
          s = replace_once(s, '  "general.font_size": 14,', '  "general.font_size": 11,', "default font size")
          p.write_text(s)

          # translate.ts: translate sentences into Russian instead of English
          p = pathlib.Path("src/main/src/platform/common/translate.ts")
          s = p.read_text()
          s = replace_once(s, 'const targetLang = "en";', 'const targetLang = "ru";', "translate target language")
          p.write_text(s)

          print("audio patch OK")
          PY

      - name: Patch CSS (dark theme by default)
        run: |
          python3 - <<'PY'
          import pathlib, re

          p = pathlib.Path("src/main/src/global.css")
          s = p.read_text()

          dark = {
              "text": "#e8e8e8",
              "text-light": "#a0a0a5",
              "text-faint": "#6e6e73",
              "text-success": "#5fd068",
              "text-warn": "#ff6b6b",
              "border": "#3a3a3c",
              "background": "#1c1c1e",
              "background-alt-light": "#242426",
              "background-alt": "#2c2c2e",
              "background-dark": "#48484a",
              "input": "#2c2c2e",
              "selected-blue": "#0a84ff",
              "button-light": "#8e8e93",
              "button-bg": "#3a3a3c",
          }
          for name, value in dark.items():
              pattern = re.compile(r"^(  --" + re.escape(name) + r": )[^;]+;", re.M)
              assert len(pattern.findall(s)) == 1, "css variable not found once: " + name
              s = pattern.sub(lambda m: m.group(1) + value + ";", s)

          old = "  --edge-horizontal-padding: 8px;"
          assert s.count(old) == 1, "edge padding var not found"
          s = s.replace(old, old + "\n  color-scheme: dark;")
          p.write_text(s)
          print("dark theme OK")
          PY

      - name: Patch Svelte (Russian settings UI, dark cards, no dictionary update, build version)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib

          root = pathlib.Path("src/main/src/components/options")
          build = os.environ["BUILD_NUMBER"]

          def patch(rel, pairs):
              p = root / rel
              s = p.read_text()
              for old, new in pairs:
                  assert s.count(old) == 1, rel + ": not found exactly once: " + old
                  s = s.replace(old, new)
              p.write_text(s)

          # dark cards
          patch("GroupedOptions.svelte", [("background-color: white;", "background-color: var(--background);")])

          # no dictionary section (and no way to replace the Russian dictionary)
          (root / "groups/GroupDictionary.svelte").write_text('<script lang="ts">\n</script>\n')

          patch("groups/GroupAbout.svelte", [
              ('title="About"', 'title="О программе"'),
              ('title="About Yomikiri"', 'title="О Yomikiri"'),
              ('return "v" + versionInfo.version;', 'return "1.0 beta(' + build + ')";'),
              ("Loading version.", "Загрузка версии."),
              ('title="Third party licenses"', 'title="Лицензии третьих сторон"'),
              ('buttonText={"View"}', 'buttonText={"Открыть"}'),
              ("View licenses for third party open source libraries & resources", "Лицензии сторонних библиотек и ресурсов с открытым кодом"),
              ('title="View source code"', 'title="Исходный код"'),
              ("https://github.com/bluegreenmagick/yomikiri", "https://github.com/HarukiWW/yomikiri"),
              ("Yomikiri is an open source project! You can view the code on GitHub.", "Yomikiri — проект с открытым исходным кодом. Код можно посмотреть на GitHub."),
          ])

          patch("groups/GroupAnki.svelte", [
              ('title="Use Anki"', 'title="Использовать Anki"'),
              ("Connecting to Anki...", "Подключение к Anki..."),
              ("Successfully connected to Anki.", "Успешно подключено к Anki."),
              ("</a> app is not installed.", "</a> не установлен."),
              ("</a> is a flashcard app.", "</a> — приложение для карточек."),
              ('title="Configure Anki template"', 'title="Настроить шаблон Anki"'),
              ('buttonText="Configure"', 'buttonText="Настроить"'),
              ('title="Reopen Safari after adding Anki note"', 'title="Возвращаться в Safari после добавления заметки"'),
              ("If disabled, you can manually return to Safari by clicking", "Если выключено, вернуться в Safari можно вручную, нажав"),
              ("on top left corner of the screen", "в левом верхнем углу экрана"),
          ])

          patch("groups/GroupAppearance.svelte", [
              ('title="Appearance"', 'title="Внешний вид"'),
              ('title="Font size"', 'title="Размер шрифта"'),
              ("Text size (px)", "Размер текста (px)"),
              ('title="Japanese Font"', 'title="Японский шрифт"'),
              ("For Japanese text only", "Только для японского текста"),
              ('title="Tooltip max height"', 'title="Максимальная высота подсказки"'),
              ("Maximum height of dictionary tooltip (px)", "Максимальная высота окна словаря (px)"),
          ])
          print("svelte patch OK")
          PY

      - name: Patch frequency dictionaries (Jiten) into the lookup tooltip
        run: |
          python3 - <<'PY'
          import base64, glob, json, pathlib, struct, zipfile

          # ---------- 1. build binary tables from Yomitan frequency dictionaries ----------
          def fnv(s):
              h = 0x811C9DC5
              b = s.encode("utf-16-le")
              for i in range(0, len(b), 2):
                  h ^= b[i] | (b[i + 1] << 8)
                  h = (h * 0x01000193) & 0xFFFFFFFF
              return h

          dicts = []
          for path in sorted(glob.glob("ours/custom-dict/jiten_freq_*.zip")):
              z = zipfile.ZipFile(path)
              title = json.loads(z.read("index.json"))["title"]
              best = {}
              for name in sorted(n for n in z.namelist() if n.startswith("term_meta_bank_")):
                  for term, kind, data in json.loads(z.read(name)):
                      if kind != "freq":
                          continue
                      if "reading" in data:
                          key = fnv(term + "|" + data["reading"])
                          freq = data["frequency"]
                      else:
                          key = fnv(term)
                          freq = data
                      rank = freq["value"] if isinstance(freq, dict) else int(freq)
                      kana = isinstance(freq, dict) and str(freq.get("displayValue", "")).endswith("\u32d5")
                      slot = best.setdefault(key, [0, 0])
                      i = 1 if kana else 0
                      if slot[i] == 0 or rank < slot[i]:
                          slot[i] = rank
              flat = []
              for key in sorted(best):
                  flat += [key, best[key][0], best[key][1]]
              blob = struct.pack("<%dI" % len(flat), *flat)
              dicts.append({"name": title, "data": base64.b64encode(blob).decode("ascii")})
              print("frequency dictionary:", title, len(best), "keys")

          bg = pathlib.Path("src/main/src/extension/background")
          data_ts = "export const FREQ_DICTS: { name: string; data: string }[] = " + json.dumps(dicts) + ";\n"
          (bg / "frequencyData.ts").write_text(data_ts)

          # ---------- 2. background: lookup by binary search ----------
          (bg / "frequency.ts").write_text('''import { handleMessage } from "extension/browserApi";
          import { FREQ_DICTS } from "./frequencyData";

          interface FreqTable {
            name: string;
            data: Uint32Array;
          }

          let tables: FreqTable[] | undefined;

          function decode(b64: string): Uint32Array {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new Uint32Array(bytes.buffer);
          }

          function hash(s: string): number {
            let h = 0x811c9dc5;
            for (let i = 0; i < s.length; i++) {
              h ^= s.charCodeAt(i);
              h = Math.imul(h, 0x01000193);
            }
            return h >>> 0;
          }

          /** Returns index of the record (3 numbers: key, rank, kana rank) */
          function find(t: Uint32Array, key: number): number | undefined {
            let lo = 0;
            let hi = t.length / 3 - 1;
            while (lo <= hi) {
              const mid = (lo + hi) >>> 1;
              const k = t[mid * 3];
              if (k === key) return mid * 3;
              if (k < key) lo = mid + 1;
              else hi = mid - 1;
            }
            return undefined;
          }

          export interface FrequencyRequest {
            term: string;
            reading: string;
          }

          export interface FrequencyResult {
            name: string;
            /** e.g. ["1065\u32d5", "59854"] */
            values: string[];
          }

          function lookup(req: FrequencyRequest): FrequencyResult[] {
            if (tables === undefined) {
              tables = FREQ_DICTS.map((d) => ({ name: d.name, data: decode(d.data) }));
            }
            const results: FrequencyResult[] = [];
            for (const t of tables) {
              const i =
                find(t.data, hash(req.term + "|" + req.reading)) ??
                find(t.data, hash(req.term));
              if (i !== undefined) {
                const items: [number, string][] = [];
                if (t.data[i + 1] > 0) items.push([t.data[i + 1], String(t.data[i + 1])]);
                if (t.data[i + 2] > 0) items.push([t.data[i + 2], t.data[i + 2] + "\u32d5"]);
                items.sort((a, b) => a[0] - b[0]);
                results.push({ name: t.name, values: items.map((x) => x[1]) });
              }
            }
            return results;
          }

          handleMessage("frequency", lookup);
          ''')

          # ---------- 3. register in background entry + message map ----------
          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          p = bg / "index.ts"
          s = p.read_text()
          s = replace_once(s, 'import { AnkiApi, type DesktopAnkiApi } from "@platform/anki";',
                           'import { AnkiApi, type DesktopAnkiApi } from "@platform/anki";\nimport "./frequency";', "bg import")
          p.write_text(s)

          # ---------- 4. badges in the dictionary entry ----------
          p = pathlib.Path("src/main/src/components/dictionary/Badges.svelte")
          s = p.read_text()
          s = replace_once(s, 'import { type Entry, isCommonEntry } from "lib/dicEntry";',
                           'import {\n    type Entry,\n    isCommonEntry,\n    getMainForm,\n    getReadingForForm,\n  } from "lib/dicEntry";', "badges import")
          s = replace_once(s, '  let hasBadges: boolean;\n',
          '''  let hasBadges: boolean;
            let freqs: { name: string; values: string[] }[] = [];
            let requestId = 0;

            function loadFrequencies(entry: Entry): void {
              freqs = [];
              if (entry.type !== "word") return;
              // eslint-disable-next-line
              const rt = (globalThis as any).chrome?.runtime;
              if (rt === undefined || typeof rt.sendMessage !== "function") return;
              const term = getMainForm(entry);
              const reading = getReadingForForm(entry, term, false).reading;
              const id = ++requestId;
              const send = (retry: boolean) => {
                // eslint-disable-next-line
                rt.sendMessage({ key: "frequency", request: { term, reading } }, (resp: any) => {
                  void rt.lastError;
                  if (id !== requestId) return;
                  if (resp === undefined && retry) {
                    setTimeout(() => send(false), 1000);
                  } else if (resp?.success === true && Array.isArray(resp.resp)) {
                    freqs = resp.resp;
                  }
                });
              };
              send(true);
            }
          ''', "badges vars")
          s = replace_once(s, '  $: hasBadges = isCommon || isName;', '  $: hasBadges = isCommon || isName || freqs.length > 0;\n  $: loadFrequencies(entry);', "badges reactive")
          s = replace_once(s, '    {#if isName}\n      <div class="badge name">name</div>\n    {/if}\n',
                           '    {#if isName}\n      <div class="badge name">name</div>\n    {/if}\n    {#each freqs as f}\n      <div class="badge freq">{f.name}: {f.values.join(", ")}</div>\n    {/each}\n', "badges markup")
          s = replace_once(s, '  .name {\n    --badge-color: #d3a7d7;\n  }\n', '  .name {\n    --badge-color: #d3a7d7;\n  }\n\n  .freq {\n    --badge-color: #8fb4d9;\n  }\n', "badges css")
          p.write_text(s)

          # ---------- 5. message map ----------
          p = pathlib.Path("src/main/src/extension/browserApi.ts")
          s = p.read_text()
          s = replace_once(s, '  getDictMetadata: [void, DictionaryMetadata];\n',
                           '  getDictMetadata: [void, DictionaryMetadata];\n  frequency: [\n    { term: string; reading: string },\n    { name: string; values: string[] }[],\n  ];\n', "message map")
          p.write_text(s)
          print("frequency patch OK")
          PY

      - name: Patch toolbar (zoom buttons A- / A+ in the lookup window)
        run: |
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path("src/main/src/components/dictionary/Toolbar.svelte")
          s = p.read_text()

          def rep(old, new):
              global s
              assert s.count(old) == 1, "toolbar: not found exactly once: " + old
              s = s.replace(old, new)

          rep('  import IconClose from "@icons/close.svg";\n',
              '  import IconClose from "@icons/close.svg";\n  import { Config } from "lib/config";\n')
          rep('  export let changeSelectedTool: (tool: Tools) => void;\n',
          '''  export let changeSelectedTool: (tool: Tools) => void;

            /** Change UI scale. Saved to config, so it is remembered. */
            async function changeSize(delta: number): Promise<void> {
              const config = await Config.instance.get();
              const size = config.get("general.font_size");
              await config.set("general.font_size", Math.min(24, Math.max(8, size + delta)));
            }
          ''')
          rep('''    {#if tooltipMode}
                <button
                  class="tool-button"
                  title="Close"''', '''    {#if tooltipMode}
                <button
                  class="tool-button text-button"
                  title="Уменьшить масштаб"
                  on:click={() => void changeSize(-1)}
                >
                  A−
                </button>
                <button
                  class="tool-button text-button"
                  title="Увеличить масштаб"
                  on:click={() => void changeSize(1)}
                >
                  A+
                </button>
                <button
                  class="tool-button"
                  title="Закрыть"''')
          rep('title="Translate sentence"', 'title="Перевести предложение"')
          rep('title="Grammar"', 'title="Грамматика"')
          rep('  .icon {\n    fill: #000000;', '  .text-button {\n    color: #000000;\n    font-weight: bold;\n    white-space: nowrap;\n  }\n\n  .icon {\n    fill: #000000;')
          p.write_text(s)
          print("toolbar patch OK")
          PY

      - name: Patch statistics (mined words, kanji, reading counter, popup view)
        run: |
          python3 - <<'PY'
          import pathlib

          ext = pathlib.Path("src/main/src/extension")

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          # ---------- storage + summary logic (runs in background and popup) ----------
          (ext / "stats.ts").write_text("""import { browserStorage } from "extension/browserApi";

          export const STATS_KEY = "stats:v1";

          export interface DayStats {
            /** unique words (dictionary form) mined that day */
            mined: string[];
            /** unique kanji in those words */
            kanji: string[];
            /** Japanese characters read */
            read: number;
            /** seconds spent reading */
            time?: number;
          }

          export interface StatsData {
            days: Record<string, DayStats>;
          }

          export interface Summary {
            words: number;
            kanji: number;
            read: number;
            time: number;
          }

          const KANJI = /[\\u3400-\\u4dbf\\u4e00-\\u9fff]/g;

          export function localDate(d: Date = new Date()): string {
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return d.getFullYear() + "-" + m + "-" + day;
          }

          export function loadStats(): Promise<StatsData> {
            return new Promise((resolve) => {
              browserStorage().get(STATS_KEY, (obj) => {
                const v = obj?.[STATS_KEY] as StatsData | undefined;
                resolve(v !== undefined && v.days !== undefined ? v : { days: {} });
              });
            });
          }

          function saveStats(data: StatsData): Promise<void> {
            return new Promise((resolve) => {
              browserStorage().set({ [STATS_KEY]: data }, () => resolve());
            });
          }

          // updates are applied one after another so they never overwrite each other
          let chain: Promise<void> = Promise.resolve();

          function update(fn: (data: StatsData) => void): Promise<void> {
            chain = chain
              .then(async () => {
                const data = await loadStats();
                fn(data);
                await saveStats(data);
              })
              .catch((e) => console.error("Could not update stats", e));
            return chain;
          }

          function today(data: StatsData): DayStats {
            const key = localDate();
            if (data.days[key] === undefined) {
              data.days[key] = { mined: [], kanji: [], read: 0, time: 0 };
            }
            return data.days[key];
          }

          /** Dictionary form of the mined word, from the note's fields. */
          export function wordFromNote(note: {
            fields: { name: string; value: string }[];
          }): string {
            const field =
              note.fields.find((f) => f.name === "Furigana") ??
              note.fields.find((f) => f.name === "Word") ??
              note.fields[0];
            const value = field?.value ?? "";
            return value
              .replace(/<[^>]*>/g, "")
              .replace(/\\[[^\\]]*\\]/g, "")
              .replace(/\\s+/g, "");
          }

          export function recordMinedNote(note: {
            fields: { name: string; value: string }[];
          }): Promise<void> {
            const word = wordFromNote(note);
            if (word === "") return Promise.resolve();
            return update((data) => {
              const d = today(data);
              if (!d.mined.includes(word)) d.mined.push(word);
              for (const k of word.match(KANJI) ?? []) {
                if (!d.kanji.includes(k)) d.kanji.push(k);
              }
            });
          }

          export function recordRead(chars: number, seconds: number): Promise<void> {
            if (!(chars > 0) && !(seconds > 0)) return Promise.resolve();
            return update((data) => {
              const d = today(data);
              if (chars > 0) d.read += Math.round(chars);
              if (seconds > 0) d.time = (d.time ?? 0) + Math.round(seconds);
            });
          }

          function dayKeys(days: number): string[] {
            const now = new Date();
            const keys: string[] = [];
            for (let i = 0; i < days; i++) {
              keys.push(
                localDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i)),
              );
            }
            return keys;
          }

          /** `days`: number of last days including today. null: all time. */
          export function summarize(data: StatsData, days: number | null): Summary {
            const words = new Set<string>();
            const kanji = new Set<string>();
            let read = 0;
            let time = 0;
            const keys = days === null ? Object.keys(data.days) : dayKeys(days);
            for (const key of keys) {
              const d = data.days[key];
              if (d === undefined) continue;
              d.mined.forEach((w) => words.add(w));
              d.kanji.forEach((k) => kanji.add(k));
              read += d.read;
              time += d.time ?? 0;
            }
            return { words: words.size, kanji: kanji.size, read, time };
          }

          /** Number of days in a row (up to today) with reading or mining. */
          export function streak(data: StatsData): number {
            const active = (key: string) => {
              const d = data.days[key];
              return d !== undefined && (d.read >= 50 || d.mined.length > 0);
            };
            const now = new Date();
            const keyAgo = (i: number) =>
              localDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() - i));
            // today may have not started yet
            let i = active(keyAgo(0)) ? 0 : 1;
            let n = 0;
            while (i < 3650 && active(keyAgo(i))) {
              n++;
              i++;
            }
            return n;
          }

          /** Oldest first. */
          export function lastDays(
            data: StatsData,
            n: number,
          ): { date: string; read: number; mined: number }[] {
            return dayKeys(n)
              .reverse()
              .map((date) => ({
                date,
                read: data.days[date]?.read ?? 0,
                mined: data.days[date]?.mined.length ?? 0,
              }));
          }
          """)

          # ---------- background: receives 'chars read' from content scripts ----------
          (ext / "background/statsHandlers.ts").write_text("""import { handleMessage } from "extension/browserApi";
          import { recordRead } from "extension/stats";

          handleMessage("statsRead", (req) => recordRead(req.chars, req.seconds));
          """)

          p = ext / "background/index.ts"
          s = p.read_text()
          s = replace_once(s, 'import "./frequency";', 'import "./frequency";\nimport "./statsHandlers";', "bg import")
          p.write_text(s)

          p = ext / "browserApi.ts"
          s = p.read_text()
          s = replace_once(s, "  getDictMetadata: [void, DictionaryMetadata];\n",
                           "  getDictMetadata: [void, DictionaryMetadata];\n  statsRead: [{ chars: number; seconds: number }, void];\n", "message map")
          p.write_text(s)

          # ---------- mined words: record when a note is added ----------
          p = ext.parent / "platform/ios/anki.ts"
          s = p.read_text()
          s = replace_once(s, 'import { iosAnkiMobileURL } from "../shared/anki";',
                           'import { iosAnkiMobileURL } from "../shared/anki";\nimport { recordMinedNote } from "extension/stats";', "anki import")
          s = replace_once(s, "  async function _addNote(note: AnkiNote): Promise<boolean> {\n",
                           "  async function _addNote(note: AnkiNote): Promise<boolean> {\n    try {\n      await recordMinedNote(note);\n    } catch (e) {\n      console.error(e);\n    }\n", "add note")
          p.write_text(s)

          # ---------- reading counter (content script, top frame only) ----------
          (ext / "content/readingStats.ts").write_text("""/**
           * Counts Japanese characters the reader has actually read.
           *
           * A block of text is credited only when it has been passed by scrolling
           * (it left the screen at the top), and only for the time it was really
           * on screen while the user was active. Scrolling quickly through text
           * credits (almost) nothing, and a page left open credits nothing.
           */
          const JP = /[\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff]/g;
          const BLOCKS = "p, li, h1, h2, h3, h4, h5, h6, blockquote, dd, dt, td, pre, div";
          const SKIP = "nav, header, footer, aside, script, style, noscript, [role='navigation']";
          /** Reading faster than this many characters per second counts as skimming. */
          const READ_CPS = 12;
          /** No touch or scroll for this long: the user is not reading. */
          const IDLE_MS = 45000;
          const FLUSH_MS = 10000;

          function jpChars(el: Element): number {
            return el.textContent?.match(JP)?.length ?? 0;
          }

          function start(): void {
            const seen = new WeakSet<Element>();
            const total = new WeakMap<Element, number>();
            const shownMs = new WeakMap<Element, number>();
            const done = new WeakSet<Element>();
            const visible = new Set<Element>();
            let pending = 0;
            let pendingMs = 0;
            let lastActive = Date.now();
            let lastTick = Date.now();

            function credit(el: Element): void {
              if (done.has(el)) return;
              done.add(el);
              visible.delete(el);
              const chars = total.get(el) ?? 0;
              if (chars === 0) return;
              const needed = (chars / READ_CPS) * 1000;
              const shown = shownMs.get(el) ?? 0;
              pending += chars * Math.min(1, shown / needed);
            }

            const io = new IntersectionObserver(
              (entries) => {
                for (const e of entries) {
                  const el = e.target;
                  if (!e.isIntersecting) {
                    visible.delete(el);
                    // left the screen at the top: the text was passed
                    if (e.boundingClientRect.bottom <= 0) credit(el);
                    continue;
                  }
                  const enough =
                    e.intersectionRatio >= 0.3 ||
                    e.intersectionRect.height >= window.innerHeight * 0.3;
                  if (enough) visible.add(el);
                  else visible.delete(el);
                }
              },
              { threshold: [0, 0.3, 0.6, 1] },
            );

            function scan(): void {
              for (const el of Array.from(document.querySelectorAll(BLOCKS))) {
                if (seen.has(el)) continue;
                if (el.querySelector(BLOCKS) !== null) continue;
                if (el.closest(SKIP) !== null) continue;
                const n = jpChars(el);
                if (n === 0) continue;
                seen.add(el);
                total.set(el, n);
                io.observe(el);
              }
            }

            let scanTimer: number | undefined;
            function scheduleScan(): void {
              if (scanTimer !== undefined) return;
              scanTimer = window.setTimeout(() => {
                scanTimer = undefined;
                scan();
              }, 1500);
            }

            function flush(): void {
              const chars = Math.floor(pending);
              const seconds = Math.floor(pendingMs / 1000);
              if (chars < 1 && seconds < 1) return;
              pending -= chars;
              pendingMs -= seconds * 1000;
              try {
                chrome.runtime.sendMessage(
                  { key: "statsRead", request: { chars, seconds } },
                  () => void chrome.runtime.lastError,
                );
              } catch (_e) {
                // extension was reloaded
              }
            }

            const touch = () => {
              lastActive = Date.now();
            };
            for (const ev of ["scroll", "touchstart", "touchmove", "pointerdown", "keydown", "click"]) {
              window.addEventListener(ev, touch, { passive: true, capture: true });
            }

            window.setInterval(() => {
              const now = Date.now();
              const dt = Math.min(now - lastTick, 2000);
              lastTick = now;
              if (
                document.visibilityState !== "visible" ||
                now - lastActive > IDLE_MS ||
                visible.size === 0
              ) {
                return;
              }
              pendingMs += dt;
              for (const el of visible) {
                shownMs.set(el, (shownMs.get(el) ?? 0) + dt);
              }
            }, 1000);

            window.setInterval(flush, FLUSH_MS);
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "hidden") flush();
            });
            window.addEventListener("pagehide", flush);

            scan();
            new MutationObserver(scheduleScan).observe(document.documentElement, {
              childList: true,
              subtree: true,
            });
          }

          try {
            if (
              window.top === window &&
              typeof chrome !== "undefined" &&
              typeof chrome.runtime?.sendMessage === "function"
            ) {
              start();
            }
          } catch (e) {
            console.error("Reading stats could not start", e);
          }
          """)

          p = ext / "content/index.ts"
          s = p.read_text()
          p.write_text('import "./readingStats";\n' + s)

          # ---------- popup: statistics instead of the power/settings buttons ----------
          (ext / "popup/StatsPage.svelte").write_text("""<script lang="ts">
            import Page from "components/Page.svelte";
            import StatsView from "./StatsView.svelte";
          </script>

          <Page>
            <StatsView />
          </Page>
          """)

          (ext / "popup/StatsView.svelte").write_text("""<script lang="ts">
            import { onMount, onDestroy } from "svelte";
            import {
              loadStats,
              summarize,
              streak,
              lastDays,
              STATS_KEY,
              type StatsData,
            } from "extension/stats";

            let data: StatsData = { days: {} };

            async function refresh(): Promise<void> {
              data = await loadStats();
            }

            function onChange(changes: Record<string, unknown>): void {
              if (STATS_KEY in changes) void refresh();
            }

            onMount(() => {
              void refresh();
              chrome.storage.onChanged.addListener(onChange);
            });

            onDestroy(() => {
              chrome.storage.onChanged.removeListener(onChange);
            });

            const fmt = (n: number) => n.toLocaleString("ru-RU");
            /** about 1.7 characters per word in running Japanese text */
            const words = (chars: number) => Math.round(chars / 1.7);

            function fmtTime(seconds: number): string {
              const minutes = Math.round(seconds / 60);
              if (minutes < 60) return minutes + " мин";
              return Math.floor(minutes / 60) + " ч " + (minutes % 60) + " мин";
            }

            function speed(read: number, seconds: number): string {
              if (seconds < 60 || read === 0) return "—";
              return fmt(Math.round(read / (seconds / 60)));
            }

            function weekday(date: string): string {
              const [y, m, d] = date.split("-").map(Number);
              return new Date(y, m - 1, d).toLocaleDateString("ru-RU", {
                weekday: "short",
              });
            }

            $: columns = [
              { title: "Сегодня", s: summarize(data, 1) },
              { title: "7 дней", s: summarize(data, 7) },
              { title: "Всё время", s: summarize(data, null) },
            ];
            $: days = lastDays(data, 7);
            $: maxRead = Math.max(1, ...days.map((d) => d.read));
            $: streakDays = streak(data);
          </script>

          <div class="stats">
            <div class="title">Статистика</div>
            <table>
              <thead>
                <tr>
                  <th></th>
                  {#each columns as c}
                    <th>{c.title}</th>
                  {/each}
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Слов в Anki</td>
                  {#each columns as c}
                    <td>{fmt(c.s.words)}</td>
                  {/each}
                </tr>
                <tr>
                  <td>Кандзи (уник.)</td>
                  {#each columns as c}
                    <td>{fmt(c.s.kanji)}</td>
                  {/each}
                </tr>
                <tr>
                  <td>Прочитано, знаков</td>
                  {#each columns as c}
                    <td>{fmt(c.s.read)}</td>
                  {/each}
                </tr>
                <tr>
                  <td>Прочитано, ≈ слов</td>
                  {#each columns as c}
                    <td>{fmt(words(c.s.read))}</td>
                  {/each}
                </tr>
                <tr>
                  <td>Время чтения</td>
                  {#each columns as c}
                    <td>{c.s.time > 0 ? fmtTime(c.s.time) : "—"}</td>
                  {/each}
                </tr>
                <tr>
                  <td>Скорость, зн./мин</td>
                  {#each columns as c}
                    <td>{speed(c.s.read, c.s.time)}</td>
                  {/each}
                </tr>
              </tbody>
            </table>

            <div class="streak">
              Серия: <b>{streakDays}</b>
              {streakDays === 1 ? "день" : "дн."} подряд
            </div>

            <div class="chart-title">Прочитано знаков за 7 дней</div>
            <div class="chart">
              {#each days as d}
                <div class="col">
                  <div class="value">{d.read > 0 ? fmt(d.read) : ""}</div>
                  <div class="bar-area">
                    <div class="bar" style="height: {Math.round((d.read / maxRead) * 100)}%"></div>
                  </div>
                  <div class="day">{weekday(d.date)}</div>
                  <div class="mined">{d.mined > 0 ? "+" + d.mined : ""}</div>
                </div>
              {/each}
            </div>
            <div class="hint">Под днём: слов добавлено в Anki</div>
          </div>

          <style>
            .stats {
              padding: 1rem 14px 1.5rem;
              font-size: 1.3rem;
            }

            .title {
              font-weight: bold;
              font-size: 1.15em;
              margin-bottom: 0.6em;
            }

            table {
              width: 100%;
              border-collapse: collapse;
              font-size: 0.95em;
            }

            th {
              text-align: right;
              font-weight: normal;
              color: var(--text-light);
              padding: 0.2em 0.3em;
              white-space: nowrap;
            }

            td {
              text-align: right;
              padding: 0.4em 0.3em;
              font-variant-numeric: tabular-nums;
              white-space: nowrap;
            }

            th:first-child,
            td:first-child {
              text-align: left;
              padding-left: 0;
              white-space: normal;
            }

            tbody tr + tr td {
              border-top: 1px solid var(--border);
            }

            .streak {
              margin-top: 1em;
            }

            .chart-title {
              margin-top: 1em;
              color: var(--text-light);
              font-size: 0.9em;
            }

            .chart {
              display: flex;
              gap: 0.3em;
              margin-top: 0.4em;
            }

            .col {
              flex: 1 1 0;
              min-width: 0;
              text-align: center;
              font-size: 0.75em;
            }

            .value {
              height: 1.3em;
              color: var(--text-light);
              overflow: hidden;
            }

            .bar-area {
              height: 4.5em;
              display: flex;
              align-items: flex-end;
            }

            .bar {
              width: 100%;
              background-color: var(--accent);
              border-radius: 0.25em 0.25em 0 0;
              min-height: 2px;
            }

            .day {
              margin-top: 0.3em;
            }

            .mined {
              height: 1.3em;
              color: var(--text-light);
            }

            .hint {
              margin-top: 0.4em;
              color: var(--text-faint);
              font-size: 0.75em;
            }
          </style>
          """)

          p = ext / "popup/index.ts"
          s = p.read_text()
          s = replace_once(s, 'import PopupPage from "./PopupPage.svelte";',
                           'import PopupPage from "./StatsPage.svelte";', "popup page")
          p.write_text(s)
          print("stats patch OK")
          PY

      - name: Pre-generate files that Xcode expects to already exist
        working-directory: src
        run: |
          pnpm generate:release
          pnpm build:ios

      - name: Build iOS app (unsigned)
        working-directory: src
        run: |
          set -euo pipefail
          PROJ=safari/Yomikiri.xcodeproj
          xcodebuild -list -project "$PROJ"
          SCHEME=$(xcodebuild -list -json -project "$PROJ" | python3 -c "
          import json, sys
          s = json.load(sys.stdin)['project']['schemes']
          bad = ('extension', 'tokenizer', 'test')
          good = [x for x in s if 'yomikiri' in x.lower() and not any(b in x.lower() for b in bad)]
          print((good or s)[0])
          ")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package .ipa
        working-directory: src
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -maxdepth 2 -name '*.app' | head -n1)
          echo "App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          rm -rf "ipa/Payload/$(basename "$APP")/PlugIns/Yomikiri Action.appex"
          PLIST="ipa/Payload/$(basename "$APP")/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Yomikiri-RU" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Yomikiri-RU" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Yomikiri-RU" "$PLIST" || true
          find ipa/Payload \( -name "*.appex" -o -name "*.framework" -o -name "*.app" \) -print0 | xargs -0 -I{} codesign --remove-signature "{}" || true
          (cd ipa && zip -qry ../Yomikiri-RU-v035.ipa Payload)
          ls -la Yomikiri-RU-v035.ipa

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yomikiri-RU-v035-ipa
          path: src/Yomikiri-RU-v035.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-v035
          path: src/xcodebuild.log
          if-no-files-found: ignore
