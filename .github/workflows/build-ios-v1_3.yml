                  for copy in copies {
                      newest = max(newest, Double(copy.value) ?? 0)
                  }
                  if copies.isEmpty {
                      lines.append(tag + ": не виден")
                  } else {
                      lines.append(tag + ": " + String(Int(now - newest)) + " с назад, каналов: " + String(copies.count))
