                              .foregroundColor(.secondary)
                              .padding()
                      }
                  }
                  .presentationDetents([.medium, .large])
                  .presentationDragIndicator(.visible)
              }
          }

          @available(iOS 16.0, *)
          struct NativeVideoListView: View {
              @State private var files: [String] = []

              var body: some View {
                  List {
                      if files.isEmpty {
                          Text("Нет файлов. Откройте «Файлы» → На iPhone → Yomikiri → Videos и положите туда MKV или MP4.")
                              .foregroundColor(.secondary)
                      }
                      ForEach(files, id: \.self) { name in
                          NavigationLink(destination: NativeVideoPlayerScreen(url: NativeVideoEngine.fileURL(name))) {
                              Text(name).lineLimit(2)
                          }
                      }
                  }
                  .navigationTitle("Видео")
                  .onAppear { files = YomikiriVideoLibrary.fileNames() }
              }
          }
          '''
              h = h.replace(old_tab, new_tab, 1)
              hv.write_text(h, encoding="utf-8")
              print("swift: native player with lookup added")

          # ---------- 4. MainView: Video tab between Dictionary and Settings ----------
          mv = pathlib.Path("src/safari/iOS (App)/MainView.swift")
          m_txt = mv.read_text(encoding="utf-8")
          settings_block = (
              "            OptionsView()\n"
