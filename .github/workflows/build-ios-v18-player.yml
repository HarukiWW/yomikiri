name: Build iOS v1.6 (Russian dictionary)

# Builds the upstream v0.3.5 release code (base) with the Russian dictionary and our own changes.
# The app version is set in ONE place: APP_VERSION below.

on:
  workflow_dispatch:
    inputs:
      english:
        description: 'Control build: keep the ORIGINAL English dictionary'
        type: boolean
        default: false
      entitlements:
        description: 'Embed the App Group entitlement (settings/statistics sync). Turn off if installing fails.'
        type: boolean
        default: true
      full_entitlements:
        description: 'Embed all 5 App Groups of the profile and a shared keychain group (not only group .1). Turn off if installing fails.'
        type: boolean
        default: true
      dict_release:
        description: 'Language dictionary: release tag with the dictionary files (zip)'
        type: string
        default: dict
      dict_glob:
        description: 'Language dictionary: name of the zip file (pattern, e.g. jp-ru-*.zip)'
        type: string
        default: 'jp-ru-*.zip'
      dict_converter:
        description: 'Language dictionary: converter script from custom-dict/ (zip -> JMdict xml)'
        type: string
        default: kolobok_to_jmdict.py

env:
  APP_VERSION: "1.8"
  RELEASE_COMMIT: 0f9ea39181d1dc66ce715665f5ef08b494e261a1

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout our files (dictionary converter)
        uses: actions/checkout@v4
        with:
          path: ours

      - name: Checkout upstream release code (base v0.3.5)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: src

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Make Node 20 the default node (Xcode scripts use a fixed PATH)
        run: |
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v npm)" /usr/local/bin/npm
          sudo ln -sf "$(command -v npx)" /usr/local/bin/npx
          /usr/local/bin/node --version

      - name: Install cargo
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Install pnpm deps
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Download Russian dictionary from release "dict"
        if: ${{ !inputs.english }}
        env:
          DICT_RELEASE: ${{ inputs.dict_release }}
        run: |
          mkdir -p ours/custom-dict
          gh release download "$DICT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --pattern 'jlpt_*.csv' --dir ours/custom-dict --clobber
          ls -la ours/custom-dict

      - name: Download original JMdict files (JMnedict is still needed)
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator download

      - name: Replace JMdict with Russian dictionary
        if: ${{ !inputs.english }}
        env:
          DICT_GLOB: ${{ inputs.dict_glob }}
          DICT_CONVERTER: ${{ inputs.dict_converter }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ls -la "$ORIG"
          ZIP=$(ls ours/custom-dict/$DICT_GLOB | head -n1)
          python3 "ours/custom-dict/$DICT_CONVERTER" "$ZIP" /tmp/jmdict_ru.xml --orig "$ORIG"
          mv /tmp/jmdict_ru.xml "$ORIG"
          ls -la "$ORIG"

      - name: Patch Rust (example sentences in dictionary entries)
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          def edit(path, fn):
              p = pathlib.Path("src") / path
              p.write_text(fn(p.read_text(encoding="utf-8")), encoding="utf-8")

          # --- jmdict crate: <example>japanese U+E002 translation</example>
          def types_rs(s):
              return replace_once(s, "    // 'example'\n    // example: Vec<Example>,\n}\n", """    /// 'example' (custom format: japanese, U+E002, translation)
              pub examples: Vec<JMExample>,
          }

          #[derive(Debug, Default, Clone, PartialEq, Eq, Serialize, Deserialize)]
          pub struct JMExample {
              pub japanese: String,
              pub translation: String,
          }
          """, "types.rs example field")
          edit("crates/jmdict/src/jmdict/types.rs", types_rs)

          def parse_rs(s):
              s = replace_once(s, "use super::types::{\n    JMDialect, JMDict, JMEntry, JMKanji, JMKanjiInfo, JMPartOfSpeech, JMReading, JMSense,\n    JMSenseMisc,\n};",
                  "use super::types::{\n    JMDialect, JMDict, JMEntry, JMExample, JMKanji, JMKanjiInfo, JMPartOfSpeech, JMReading,\n    JMSense, JMSenseMisc,\n};", "parse.rs import")
              s = replace_once(s, """                b"example" => {
                              parse_string_in_tag_into(&mut self.reader, &mut self.buf, b"example")?;
                          }""", """                b"example" => {
                              let text =
                                  parse_string_in_tag_into(&mut self.reader, &mut self.buf, b"example")?;
                              if let Some((japanese, translation)) = text.split_once('\\u{e002}') {
                                  sense.examples.push(JMExample {
                                      japanese: japanese.to_string(),
                                      translation: translation.to_string(),
                                  });
                              }
                          }""", "parse.rs example arm")
              return s
          edit("crates/jmdict/src/jmdict/parse.rs", parse_rs)

          # --- yomikiri-dictionary crate: Sense.examples
          def entry_rs(s):
              return replace_once(s, "    pub dialects: Vec<JMDialect>,\n}\n", """    pub dialects: Vec<JMDialect>,
              /// Example sentences (Japanese with marked keyword, translation)
              pub examples: Vec<SenseExample>,
          }

          #[cfg_attr(feature = "wasm", derive(Tsify))]
          #[cfg_attr(feature = "wasm", tsify(into_wasm_abi))]
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct SenseExample {
              /// The keyword is wrapped in U+E000 ... U+E001
              pub japanese: String,
              pub translation: String,
          }
          """, "entry.rs Sense")
          edit("crates/yomikiri-dictionary/src/entry.rs", entry_rs)

          def jmdict_rs(s):
              s = replace_once(s, "    GroupedSense, Kanji, PartOfSpeech, Rarity, Reading, Sense, WordEntry, WordEntryInner,\n};",
                  "    GroupedSense, Kanji, PartOfSpeech, Rarity, Reading, Sense, SenseExample, WordEntry,\n    WordEntryInner,\n};", "jmdict.rs import")
              return replace_once(s, "            meanings: jm_sense\n", """            examples: jm_sense
                          .examples
                          .into_iter()
                          .map(|e| SenseExample {
                              japanese: e.japanese,
                              translation: e.translation,
                          })
                          .collect(),
                      meanings: jm_sense
          """, "jmdict.rs From")
          edit("crates/yomikiri-dictionary/src/jmdict.rs", jmdict_rs)

          edit("crates/yomikiri-dictionary/src/jmnedict.rs", lambda s: replace_once(s,
              "                    dialects: vec![],\n                })",
              "                    dialects: vec![],\n                    examples: vec![],\n                })", "jmnedict.rs"))
          edit("crates/yomikiri-dictionary/src/lib.rs", lambda s: replace_once(s,
              "pub use entry::{Kanji, PartOfSpeech, Reading, Sense, WordEntry};",
              "pub use entry::{Kanji, PartOfSpeech, Reading, Sense, SenseExample, WordEntry};", "lib.rs"))
          PY

      - name: Add example sentences to the Russian dictionary (XML)
        if: ${{ !inputs.english }}
        env:
          DICT_GLOB: ${{ inputs.dict_glob }}
        run: |
          set -euo pipefail
          ORIG=src/crates/yomikiri-dictionary-generator/jmdict/jmdict_english.xml
          ZIP=$(ls ours/custom-dict/$DICT_GLOB | head -n1)
          cat > /tmp/add_examples.py <<'PY'
          import glob, json, sys, zipfile, re, unicodedata

          KS, KE, SEP = "\ue000", "\ue001", "\ue002"

          def flat(node, mark=False):
              """Plain text of structured content; skips <rt>; marks example-keyword."""
              if node is None:
                  return ""
              if isinstance(node, str):
                  return node
              if isinstance(node, list):
                  return "".join(flat(n, mark) for n in node)
              if isinstance(node, dict):
                  tag = node.get("tag")
                  if tag == "rt" or tag == "rp":
                      return ""
                  inner = flat(node.get("content"), mark)
                  data = node.get("data") or {}
                  if mark and data.get("content") == "example-keyword" and inner:
                      return KS + inner + KE
                  return inner
              return ""

          def walk(node, fn):
              if isinstance(node, list):
                  for n in node:
                      walk(n, fn)
              elif isinstance(node, dict):
                  fn(node)
                  walk(node.get("content"), fn)

          def find(node, name, out):
              def f(n):
                  d = n.get("data")
                  if d and d.get("content") == name:
                      out.append(n)
              walk(node, f)
              return out

          def norm(s):
              return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", s)).strip()

          def extract(zip_path):
              """-> {seq: [variant, ...]}, variant = [ {"glosses": [..], "examples": [(ja_marked, ru)]}, ... ] (all senses of one Yomitan entry)"""
              result = {}
              with zipfile.ZipFile(zip_path) as z:
                  names = sorted(n for n in z.namelist() if re.match(r"term_bank_\d+\.json$", n.split("/")[-1]))
                  for name in names:
                      for e in json.loads(z.read(name)):
                          seq = e[6]
                          variant = []
                          for g in e[5]:
                              if not isinstance(g, dict) or g.get("type") != "structured-content":
                                  continue
                              for sense in find(g["content"], "sense", []):
                                  glosses = []
                                  for gl in find(sense, "glossary", []):
                                      c = gl.get("content")
                                      for li in (c if isinstance(c, list) else [c]):
                                          t = norm(flat(li))
                                          if t:
                                              glosses.append(t)
                                  exs = []
                                  for ex in find(sense, "example-sentence", []):
                                      a = find(ex, "example-sentence-a", [])
                                      b = find(ex, "example-sentence-b", [])
                                      if a and b:
                                          ja = flat(a[0], True).strip()
                                          ru = re.sub(r"\s*\[\d+\]\s*$", "", norm(flat(b[0])))
                                          if ja and ru and (ja, ru) not in exs:
                                              exs.append((ja, ru))
                                  variant.append({"glosses": glosses, "examples": exs})
                          if any(s["examples"] for s in variant):
                              lst = result.setdefault(seq, [])
                              if variant not in lst:
                                  lst.append(variant)
              return result


          import html, re, sys, unicodedata

          MAX_PER_SENSE = 2
          ENTRY_RE = re.compile(r"<entry>.*?</entry>", re.S)
          SEQ_RE = re.compile(r"<ent_seq>\s*(\d+)\s*</ent_seq>")
          SENSE_RE = re.compile(r"<sense>.*?</sense>", re.S)
          GLOSS_RE = re.compile(r"<gloss[^>]*>(.*?)</gloss>", re.S)

          def tokens(glosses):
              return set(re.findall(r"\w+", " ".join(glosses).lower()))

          def clean(t):
              return t.replace("&", "\uff06").replace("<", "\u2039").replace(">", "\u203a")

          def inject(xml_in, xml_out, zip_path):
              data = extract(zip_path)
              st = dict(entries=0, senses=0, matched_index=0, matched_gloss=0, examples=0)
              with open(xml_in, encoding="utf-8") as f:
                  text = f.read()

              def fix_entry(m):
                  block = m.group(0)
                  sm = SEQ_RE.search(block)
                  if not sm:
                      return block
                  variants = data.get(int(sm.group(1)))
                  if not variants:
                      return block
                  senses = SENSE_RE.findall(block)
                  if not senses:
                      return block
                  xml_g = [[norm(html.unescape(g)) for g in GLOSS_RE.findall(s)] for s in senses]
                  chosen = [None] * len(senses)
                  # 1) variant with the same number of senses, best gloss overlap, matched by index
                  same = [v for v in variants if len(v) == len(senses)]
                  if same:
                      def score(v):
                          total = 0.0
                          for xg, ys in zip(xml_g, v):
                              a, b = tokens(xg), tokens(ys["glosses"])
                              if a and b:
                                  total += len(a & b) / len(a | b)
                          return total
                      best = max(same, key=score)
                      chosen = [ys["examples"] for ys in best]
                      st["matched_index"] += len(senses)
                  else:
                      # 2) per sense: identical gloss list in some variant
                      for i, xg in enumerate(xml_g):
                          for v in variants:
                              for ys in v:
                                  if ys["glosses"] == xg and ys["examples"]:
                                      chosen[i] = ys["examples"]
                                      break
                              if chosen[i]:
                                  break
                          if chosen[i]:
                              st["matched_gloss"] += 1
                  st["entries"] += 1
                  st["senses"] += len(senses)
                  out, pos, idx = [], 0, 0
                  for sm2 in SENSE_RE.finditer(block):
                      s = sm2.group(0)
                      exs = chosen[idx] or []
                      idx += 1
                      if exs:
                          add = "".join(
                              "<example>%s%s%s</example>" % (clean(ja), SEP, clean(ru))
                              for ja, ru in exs[:MAX_PER_SENSE]
                          )
                          st["examples"] += min(len(exs), MAX_PER_SENSE)
                          s = s[: -len("</sense>")] + add + "</sense>"
                      out.append(block[pos : sm2.start()])
                      out.append(s)
                      pos = sm2.end()
                  out.append(block[pos:])
                  return "".join(out)

              text = ENTRY_RE.sub(fix_entry, text)
              with open(xml_out, "w", encoding="utf-8") as f:
                  f.write(text)
              print("examples injected:", st)
              if st["examples"] == 0:
                  raise SystemExit("ERROR: no examples were matched to dictionary entries")


          if __name__ == "__main__":
              inject(sys.argv[1], sys.argv[2], sys.argv[3])
          PY
          python3 /tmp/add_examples.py "$ORIG" /tmp/jmdict_ru_examples.xml "$ZIP"
          mv /tmp/jmdict_ru_examples.xml "$ORIG"
          ls -la "$ORIG"

      - name: Generate yomikiri dictionary
        working-directory: src
        run: pnpm run --dir ./crates/yomikiri-dictionary-generator generate

      - name: Patch Svelte (example sentences in the word card)
        run: |
          python3 - <<'PY'
          import pathlib

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          p = pathlib.Path("src/main/src/components/dictionary/GroupedSenseView.svelte")
          s = p.read_text(encoding="utf-8")

          s = replace_once(s, '  $: posText = group.pos.join(", ");\n', '''  $: posText = group.pos.join(", ");

            /** Splits an example sentence into plain parts and the keyword (U+E000 ... U+E001). */
            function exampleParts(text: string): { text: string; key: boolean }[] {
              const parts: { text: string; key: boolean }[] = [];
              const re = /\\ue000(.*?)\\ue001/g;
              let last = 0;
              let m: RegExpExecArray | null;
              while ((m = re.exec(text)) !== null) {
                if (m.index > last) parts.push({ text: text.slice(last, m.index), key: false });
                parts.push({ text: m[1], key: true });
                last = m.index + m[0].length;
              }
              if (last < text.length) parts.push({ text: text.slice(last), key: false });
              return parts;
            }
          ''', "svelte script")

          s = replace_once(s, '''          >{/if}
                </div>
              {/each}''', '''          >{/if}
                  {#if sense.examples && sense.examples.length > 0}
                    <div class="examples">
                      {#each sense.examples as example}
                        <div class="example">
                          <div class="example-ja">
                            {#each exampleParts(example.japanese) as part}{#if part.key}<b>{part.text}</b>{:else}{part.text}{/if}{/each}
                          </div>
                          <div class="example-tr">{example.translation}</div>
                        </div>
                      {/each}
                    </div>
                  {/if}
                </div>
              {/each}''', "svelte template")

          s = replace_once(s, "</style>", '''
            .examples {
              margin: 0.2rem 0 0.4rem 1.1rem;
              padding-left: 0.6rem;
              border-left: 2px solid var(--text-faint);
            }

            .example {
              margin-bottom: 0.25rem;
            }

            .example-ja {
              font-size: 0.9rem;
              line-height: 1.35;
              color: var(--text-light);
            }

            .example-ja b {
              font-weight: 600;
              color: var(--text);
            }

            .example-tr {
              font-size: 0.8rem;
              line-height: 1.3;
              color: var(--text-faint);
            }
          </style>''', "svelte style")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Patch Swift (App Group sync, statistics tab, share sheet)
        run: |
          python3 - <<'PY'
          import pathlib, re

          root = pathlib.Path("src/safari")
          tok = root / "YomikiriTokenizer/YomikiriTokenizer"

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          def regex_replace_once(text, pattern, new, label):
              m = re.search(pattern, text, re.S)
              assert m, "pattern not found: " + label
              return text[: m.start()] + new + text[m.end():]

          # ---------- 1. App Group: find the group that this process can really access ----------
          p = tok / "Utils.swift"
          s = p.read_text()
          s = regex_replace_once(s, r"public func getSharedDirectory\(\) throws -> URL \{.*?\n\}\n", '''/// App Groups that may be available to this process:
          /// the one the app was built with, and the groups listed in the embedded provisioning profile.
          private func candidateAppGroupIds() -> [String] {
              var ids: [String] = [APP_GROUP_ID]
              if let path = Bundle.main.path(forResource: "embedded", ofType: "mobileprovision"),
                 let data = FileManager.default.contents(atPath: path),
                 let text = String(data: data, encoding: .isoLatin1),
                 let start = text.range(of: "<?xml"),
                 let end = text.range(of: "</plist>"),
                 start.lowerBound < end.upperBound,
                 let xml = String(text[start.lowerBound ..< end.upperBound]).data(using: .utf8),
                 let plist = (try? PropertyListSerialization.propertyList(from: xml, options: [], format: nil)) as? [String: Any],
                 let entitlements = plist["Entitlements"] as? [String: Any],
                 let groups = entitlements["com.apple.security.application-groups"] as? [String]
              {
                  for group in groups.sorted() where !ids.contains(group) {
                      ids.append(group)
                  }
              }
              return ids
          }

          /// The first App Group that this process can access, if there is one.
          let resolvedAppGroup: (id: String, url: URL)? = {
              for id in candidateAppGroupIds() {
                  if let url = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: id) {
                      return (id: id, url: url)
                  }
              }
              return nil
          }()

          /// Returns URL path to directory that all Yomikiri apps share
          public func getSharedDirectory() throws -> URL {
              if let group = resolvedAppGroup {
                  return group.url
              }
              // Fallback for builds without App Group access: the private folder of this process
              let fm = FileManager.default
              guard let dir = fm.urls(for: .applicationSupportDirectory, in: .userDomainMask).first else {
                  throw YomikiriTokenizerError.CouldNotAccessDirectory
              }
              if !fm.fileExists(atPath: dir.path) {
                  try fm.createDirectory(at: dir, withIntermediateDirectories: true)
              }
              return dir
          }
          ''', "getSharedDirectory")
          p.write_text(s)

          # ---------- 2. shared UserDefaults + stats storage ----------
          p = tok / "Storage.swift"
          s = p.read_text()
          s = replace_once(s, '    public static let dictSchemaVer = StorageProperty<Int>(key: "dict.schema_ver")\n',
                           '    public static let dictSchemaVer = StorageProperty<Int>(key: "dict.schema_ver")\n    /// Reading and mining statistics (JSON), shared between the extension and the app\n    public static let stats = StoragePropertyWithDefault<String>(key: "stats.v1", other: "null")\n', "stats property")
          s = regex_replace_once(s, r"private func getSharedDefaults\(\) -> Result<UserDefaults, YomikiriTokenizerError> \{.*?\n\}\n", '''private func getSharedDefaults() -> Result<UserDefaults, YomikiriTokenizerError> {
              if let group = resolvedAppGroup, let shared = UserDefaults(suiteName: group.id) {
                  return .success(shared)
              }
              return .success(UserDefaults.standard)
          }
          ''', "getSharedDefaults")
          p.write_text(s)

          # ---------- 3. extension handler: load / save statistics ----------
          p = root / "iOS (Extension)/IOSWebExtensionHandler.swift"
          s = p.read_text()
          s = replace_once(s, '                case "iosVersion":\n',
                           '                case "loadStats":\n                    jsonResponse = try Storage.stats.get()\n                case "saveStats":\n                    try Storage.stats.set(request)\n                case "iosVersion":\n', "handler stats")
          p.write_text(s)

          # ---------- 4. statistics tab instead of Help ----------
          (root / "iOS (App)/HelpView.swift").write_text('''//
          //  HelpView.swift
          //  Yomikiri (iOS)
          //
          //  Replaced by the statistics screen.
          //

          import SwiftUI
          import YomikiriTokenizer

          struct StatDay: Decodable {
              var mined: [String] = []
              var kanji: [String] = []
              var read = 0
              var time = 0
              var sentences = 0
              var words = 0

              enum CodingKeys: String, CodingKey {
                  case mined, kanji, read, time, sentences, words
              }

              init() {}

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  mined = (try? c.decode([String].self, forKey: .mined)) ?? []
                  kanji = (try? c.decode([String].self, forKey: .kanji)) ?? []
                  read = (try? c.decode(Int.self, forKey: .read)) ?? 0
                  time = (try? c.decode(Int.self, forKey: .time)) ?? 0
                  sentences = (try? c.decode(Int.self, forKey: .sentences)) ?? 0
                  words = (try? c.decode(Int.self, forKey: .words)) ?? 0
              }
          }

          struct StatFile: Decodable {
              var days: [String: StatDay]
          }

          struct StatSummary {
              var minedWords = 0
              var kanji = 0
              var read = 0
              var time = 0
              var sentences = 0
              var readWords = 0
          }

          struct StatBar: Identifiable {
              var id: String
              var label: String
              var read: Int
          }

          private let statDateFormatter: DateFormatter = {
              let formatter = DateFormatter()
              formatter.locale = Locale(identifier: "en_US_POSIX")
              formatter.dateFormat = "yyyy-MM-dd"
              return formatter
          }()

          private let statWeekdayFormatter: DateFormatter = {
              let formatter = DateFormatter()
              formatter.locale = Locale(identifier: "ru_RU")
              formatter.dateFormat = "E"
              return formatter
          }()

          private func statDate(daysAgo: Int) -> Date {
              return Calendar.current.date(byAdding: .day, value: -daysAgo, to: Date()) ?? Date()
          }

          private func statKey(daysAgo: Int) -> String {
              return statDateFormatter.string(from: statDate(daysAgo: daysAgo))
          }

          private func statNumber(_ n: Int) -> String {
              let formatter = NumberFormatter()
              formatter.numberStyle = .decimal
              formatter.locale = Locale(identifier: "ru_RU")
              return formatter.string(from: NSNumber(value: n)) ?? String(n)
          }

          private func statDuration(_ seconds: Int) -> String {
              if seconds <= 0 {
                  return "—"
              }
              let minutes = Int((Double(seconds) / 60.0).rounded())
              if minutes < 60 {
                  return String(minutes) + " мин"
              }
              return String(minutes / 60) + " ч " + String(minutes % 60) + " мин"
          }

          @MainActor
          final class StatsViewModel: ObservableObject {
              @Published var days: [String: StatDay] = [:]

              func reload() {
                  guard let json = try? Storage.stats.get(),
                        let data = json.data(using: .utf8),
                        let file = try? JSONDecoder().decode(StatFile.self, from: data)
                  else {
                      days = [:]
                      return
                  }
                  days = file.days
              }

              func reset() {
                  let token = UUID().uuidString
                  _ = try? Storage.stats.set("{\\"days\\":{},\\"resetToken\\":\\"" + token + "\\"}")
                  reload()
              }

              /// `lastDays`: number of last days including today. nil: all time.
              func summary(lastDays: Int?) -> StatSummary {
                  var words = Set<String>()
                  var kanji = Set<String>()
                  var result = StatSummary()
                  var keys: [String] = []
                  if let n = lastDays {
                      for i in 0 ..< n {
                          keys.append(statKey(daysAgo: i))
                      }
                  } else {
                      keys = Array(days.keys)
                  }
                  for key in keys {
                      guard let day = days[key] else {
                          continue
                      }
                      for w in day.mined {
                          words.insert(w)
                      }
                      for k in day.kanji {
                          kanji.insert(k)
                      }
                      result.read += day.read
                      result.time += day.time
                      result.sentences += day.sentences
                      result.readWords += day.words
                  }
                  result.minedWords = words.count
                  result.kanji = kanji.count
                  return result
              }

              func streak() -> Int {
                  func isActive(_ key: String) -> Bool {
                      guard let day = days[key] else {
                          return false
                      }
                      return day.read >= 50 || !day.mined.isEmpty
                  }
                  var i = isActive(statKey(daysAgo: 0)) ? 0 : 1
                  var count = 0
                  while i < 3650 && isActive(statKey(daysAgo: i)) {
                      count += 1
                      i += 1
                  }
                  return count
              }

              func bars() -> [StatBar] {
                  var result: [StatBar] = []
                  for i in (0 ..< 7).reversed() {
                      let key = statKey(daysAgo: i)
                      let label = statWeekdayFormatter.string(from: statDate(daysAgo: i))
                      result.append(StatBar(id: key, label: label, read: days[key]?.read ?? 0))
                  }
                  return result
              }
          }

          struct StatCard: View {
              let title: String
              let value: String

              var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      Text(value)
                          .font(.system(size: 26, weight: .semibold, design: .rounded))
                          .lineLimit(1)
                          .minimumScaleFactor(0.6)
                      Text(title)
                          .font(.footnote)
                          .foregroundColor(.secondary)
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .padding(14)
                  .background(Color(.secondarySystemBackground))
                  .cornerRadius(14)
              }
          }

          struct HelpView: View {
              @StateObject private var model = StatsViewModel()
              @State private var period = 0
              @State private var confirmReset = false

              private var summary: StatSummary {
                  if period == 0 {
                      return model.summary(lastDays: 1)
                  } else if period == 1 {
                      return model.summary(lastDays: 7)
                  } else {
                      return model.summary(lastDays: nil)
                  }
              }

              private func speed(_ s: StatSummary) -> String {
                  if s.time < 60 || s.read == 0 {
                      return "—"
                  }
                  return statNumber(Int((Double(s.read) / (Double(s.time) / 60.0)).rounded()))
              }

              var body: some View {
                  let s = summary
                  let bars = model.bars()
                  let maxRead = max(1, bars.map { $0.read }.max() ?? 1)
                  return ScrollView {
                      VStack(alignment: .leading, spacing: 16) {
                          Text("Статистика")
                              .font(.system(size: 30, weight: .bold))

                          Picker("Период", selection: $period) {
                              Text("Сегодня").tag(0)
                              Text("7 дней").tag(1)
                              Text("Всё время").tag(2)
                          }
                          .pickerStyle(.segmented)

                          LazyVGrid(
                              columns: [GridItem(.flexible(), spacing: 12), GridItem(.flexible(), spacing: 12)],
                              spacing: 12
                          ) {
                              StatCard(title: "Слов в Anki", value: statNumber(s.minedWords))
                              StatCard(title: "Кандзи (уник.)", value: statNumber(s.kanji))
                              StatCard(title: "Прочитано предложений", value: statNumber(s.sentences))
                              StatCard(title: "Прочитано слов", value: statNumber(s.readWords))
                              StatCard(title: "Прочитано знаков", value: statNumber(s.read))
                              StatCard(title: "Время чтения", value: statDuration(s.time))
                              StatCard(title: "Скорость, зн./мин", value: speed(s))
                              StatCard(title: "Серия, дней подряд", value: statNumber(model.streak()))
                          }

                          VStack(alignment: .leading, spacing: 10) {
                              Text("Прочитано знаков за 7 дней")
                                  .font(.footnote)
                                  .foregroundColor(.secondary)
                              HStack(alignment: .bottom, spacing: 8) {
                                  ForEach(bars) { bar in
                                      VStack(spacing: 4) {
                                          RoundedRectangle(cornerRadius: 4)
                                              .fill(Color.orange)
                                              .frame(height: max(3, 90 * CGFloat(bar.read) / CGFloat(maxRead)))
                                          Text(bar.label)
                                              .font(.caption2)
                                              .foregroundColor(.secondary)
                                      }
                                      .frame(maxWidth: .infinity)
                                  }
                              }
                              .frame(height: 120, alignment: .bottom)
                          }
                          .padding(14)
                          .background(Color(.secondarySystemBackground))
                          .cornerRadius(14)

                          Button(role: .destructive) {
                              confirmReset = true
                          } label: {
                              Text("Сбросить статистику")
                                  .frame(maxWidth: .infinity)
                          }
                          .buttonStyle(.bordered)
                      }
                      .padding(16)
                  }
                  .onAppear {
                      model.reload()
                  }
                  .onReceive(NotificationCenter.default.publisher(for: UIApplication.didBecomeActiveNotification)) { _ in
                      model.reload()
                  }
                  .confirmationDialog("Удалить всю статистику?", isPresented: $confirmReset, titleVisibility: .visible) {
                      Button("Удалить", role: .destructive) {
                          model.reset()
                      }
                      Button("Отмена", role: .cancel) {}
                  }
              }
          }
          ''')

          # ---------- 5. Russian tab and screen titles ----------
          p = root / "iOS (App)/MainView.swift"
          s = p.read_text()
          s = replace_once(s, 'Label("Help", systemImage: "questionmark.circle")', 'Label("Статистика", systemImage: "chart.bar.fill")', "tab help")
          s = replace_once(s, 'Label("Dictionary", systemImage: "character.book.closed.fill")', 'Label("Словарь", systemImage: "character.book.closed.fill")', "tab dictionary")
          s = replace_once(s, 'Label("Settings", systemImage: "gearshape.fill")', 'Label("Настройки", systemImage: "gearshape.fill")', "tab settings")
          p.write_text(s)

          p = root / "iOS (App)/OptionsView.swift"
          s = p.read_text()
          s = replace_once(s, '.navigationTitle("Anki Template")', '.navigationTitle("Шаблон Anki")', "anki title")
          s = replace_once(s, '.navigationTitle("Settings")', '.navigationTitle("Настройки")', "settings title")
          p.write_text(s)

          # ---------- 6. share sheet: valid url + open the link through the host app ----------
          p = root / "Shared (iOS)/Globals.swift"
          s = p.read_text()
          s = replace_once(s, "func jsonSerialize<T: Encodable>(obj: T?) throws -> String {", '''/// `URL(string:)`. If the string is not a valid URL as it is, it is percent-encoded and tried again.
          func makeUrl(_ urlString: String) -> URL? {
              if let url = URL(string: urlString) {
                  return url
              }
              var allowed = CharacterSet.alphanumerics
              allowed.insert(charactersIn: "-._~:/?#&=+;@$,!*'()%")
              guard let encoded = urlString.addingPercentEncoding(withAllowedCharacters: allowed) else {
                  return nil
              }
              return URL(string: encoded)
          }

          func jsonSerialize<T: Encodable>(obj: T?) throws -> String {''', "makeUrl")
          p.write_text(s)

          p = root / "Shared (iOS)/YomikiriWebView.swift"
          s = p.read_text()
          s = replace_once(s, '''                guard let url = URL(string: urlString) else {
                              throw "'openLink' url is not valid: \\(urlString)"''', '''                guard let url = makeUrl(urlString) else {
                              throw "'openLink' url is not valid: \\(urlString)"''', "webview openLink")
          p.write_text(s)

          p = root / "Yomikiri Action/ActionViewController.swift"
          s = p.read_text()
          s = replace_once(s, '''                    guard let url = URL(string: urlString) else {
                                  throw "'openLink' url is not valid: \\(urlString)"''', '''                    guard let url = makeUrl(urlString) else {
                                  throw "'openLink' url is not valid: \\(urlString)"''', "action openLink")
          s = regex_replace_once(s, r"    func openURL\(_ url: URL\) \{.*?\n    \}\n", '''    func openURL(_ url: URL) {
                  if let ctx = self.extensionContext {
                      ctx.open(url, completionHandler: nil)
                  }
                  // A share extension cannot open another app by itself: ask the host application to do it.
                  let selector = NSSelectorFromString("openURL:options:completionHandler:")
                  typealias OpenFunction = @convention(c) (AnyObject, Selector, URL, [UIApplication.OpenExternalURLOptionsKey: Any], ((Bool) -> Void)?) -> Void
                  var responder: UIResponder? = self
                  while let current = responder {
                      if current.responds(to: selector), let imp = current.method(for: selector) {
                          let function = unsafeBitCast(imp, to: OpenFunction.self)
                          function(current, selector, url, [:], nil)
                          return
                      }
                      responder = current.next
                  }
              }
          ''', "action openURL")
          p.write_text(s)
          print("swift patch OK")
          PY

      - name: Patch TypeScript (add "audio" field type)
        run: |
          python3 - <<'PY'
          import pathlib

          d = pathlib.Path("src/main/src/lib/anki")

          def replace_once(text, old, new, label):
              assert text.count(old) == 1, "pattern not found exactly once: " + label
              return text.replace(old, new)

          # template.ts: new field type "audio"
          p = d / "template.ts"
          s = p.read_text()
          s = replace_once(s, '  link: FieldBase<"link">;\n}', '  link: FieldBase<"link">;\n  audio: FieldBase<"audio">;\n}', "types")
          s = replace_once(s, '  "url",\n  "link",\n];', '  "url",\n  "link",\n  "audio",\n];', "type list")
          s = replace_once(s, '  link: "link",\n};', '  link: "link",\n  audio: "audio",\n};', "labels")
          s = replace_once(s, '    content === "link"\n  ) {', '    content === "link" ||\n    content === "audio"\n  ) {', "new field")
          p.write_text(s)

          # ankiBuilder.ts: builder for "audio"
          p = d / "ankiBuilder.ts"
          s = p.read_text()
          s += """
          /**
           * Audio from JapanesePod101.
           *
           * AnkiMobile downloads a field's content by itself if the whole field is a link
           * to an audio file, and replaces it with a [sound:...] tag.
           * The link must end with a known file extension, so a fake argument is appended.
           */
          const JPOD101_URL = "https://assets.languagepod101.com/dictionary/japanese/audiomp3.php";
          /** Size of the 'audio not available' clip that JapanesePod101 returns. */
          const JPOD101_PLACEHOLDER_SIZE = 52288;

          async function findJpod101Audio(word: string, reading: string): Promise<string> {
            const query = `?kanji=${encodeURIComponent(word)}&kana=${encodeURIComponent(reading)}`;
            try {
              const resp = await fetch(JPOD101_URL + query);
              if (!resp.ok) return "";
              const buf = await resp.arrayBuffer();
              if (buf.byteLength === JPOD101_PLACEHOLDER_SIZE || buf.byteLength < 2000) {
                return "";
              }
            } catch (err) {
              // Could not verify (network or cross-origin restrictions).
              // Still give the link to AnkiMobile.
              console.warn("Could not check JapanesePod101 audio:", err);
            }
            return JPOD101_URL + query + "&fakePath=audio.mp3";
          }

          addBuilder("audio", (_opts, data) => {
            const token = data.tokenized.tokens[data.tokenized.tokenIdx];
            const word = token.base;
            const reading = getReadingForForm(data.entry, word, false).reading || word;
            return Utils.PromiseWithProgress.fromPromise(
              findJpod101Audio(word, reading),
              "Finding audio...",
            );
          });
          """
          p.write_text(s)
          # config.ts: bake the Anki template into the defaults.
          # Sideloaded builds have no shared storage, so the extension cannot see
          # settings saved in the app. Stored settings still override these defaults.
          import json
          DEFAULT_TEMPLATE = {
              "deck": "mining",
              "notetype": "kaishi mining",
              "tags": "yomikiri-ru",
              "fields": [
                  {"name": "Word", "content": "word", "form": "as-is", "style": "basic"},
                  {"name": "Reading", "content": ""},
                  {"name": "Meaning", "content": "meaning", "full_format": "numbered", "full_pos": False, "full_max_item": 0, "single_pos": False, "single_max_item": 0},
                  {"name": "Sentence", "content": "sentence", "style": "basic", "word": "none"},
                  {"name": "SentenceMeaning", "content": "translated-sentence"},
                  {"name": "Audio", "content": "audio"},
                  {"name": "SectenceAudio", "content": ""},
                  {"name": "Image", "content": ""},
                  {"name": "Furigana", "content": "word", "form": "main-dict-form", "style": "furigana-anki"},
              ],
          }
          override = pathlib.Path("ours/custom-dict/anki_template.json")
          template = json.loads(override.read_text()) if override.exists() else DEFAULT_TEMPLATE
          p = pathlib.Path("src/main/src/lib/config.ts")
          s = p.read_text()
          old = '  "anki.anki_template": null,\n  "anki.enabled": false,'
          assert s.count(old) == 1, "default anki options not found in config.ts"
          tpl_ts = json.dumps(template, indent=2, ensure_ascii=False).replace("\n", "\n  ")
          s = s.replace(old, '  "anki.anki_template": ' + tpl_ts + ',\n  "anki.enabled": true,')
          s = replace_once(s, '  "general.font_size": 14,', '  "general.font_size": 11,', "default font size")
          p.write_text(s)

          # translate.ts: translate sentences into Russian instead of English
