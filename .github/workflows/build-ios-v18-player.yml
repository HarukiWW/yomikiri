          /** Index of the record (2 numbers: key, level) */
          function find(t: Uint32Array, key: number): number | undefined {
            let lo = 0;
            let hi = t.length / 2 - 1;
            while (lo <= hi) {
              const mid = (lo + hi) >>> 1;
              const k = t[mid * 2];
              if (k === key) return mid * 2;
              if (k < key) lo = mid + 1;
              else hi = mid - 1;
